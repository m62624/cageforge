[workspace]
resolver = "2"
members = [
    "crates/cageforge-backend-api",
    "crates/cageforge-bwrap",
    "crates/cageforge-linux",
    "crates/cageforge-network-proxy",
    "crates/cageforge-windows",
    "crates/cageforge-command",
    "crates/cageforge-config",
    "crates/cageforge-path",
    "crates/cageforge-policy",
    "crates/cageforge-policy-compose",
    "crates/cageforge-core",
    "tools/cageforge-upstream-review",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/m62624/cageforge"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
cageforge-command = { path = "crates/cageforge-command", version = "0.1.0" }
cageforge-backend-api = { path = "crates/cageforge-backend-api", version = "0.1.0" }
cageforge-bwrap = { path = "crates/cageforge-bwrap", version = "0.1.0" }
cageforge-config = { path = "crates/cageforge-config", version = "0.1.0" }
cageforge-linux = { path = "crates/cageforge-linux", version = "0.1.0" }
cageforge-network-proxy = { path = "crates/cageforge-network-proxy", version = "0.1.0", default-features = false }
cageforge-policy = { path = "crates/cageforge-policy", version = "0.1.0" }
cageforge-policy-compose = { path = "crates/cageforge-policy-compose", version = "0.1.0" }
cageforge-path = { path = "crates/cageforge-path", version = "0.1.0" }
cageforge-windows = { path = "crates/cageforge-windows", version = "0.1.0" }
command-fds = "0.3.3"
clap = { version = "4.6.6", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
toml = "1.1.4"
pretty_assertions = "1.4.1"
proptest = "1.11.0"
globset = "0.4.20"
wildmatch = "2.6.1"
libc = "0.2.177"
seccompiler = "0.5.0"
bytes = "1.12.1"
cc = "1.4.4"
getrandom = "0.4.3"
hickory-resolver = "0.26.1"
http-body-util = "0.1.5"
hyper = "1.11.0"
hyper-util = "0.1.20"
tokio = "1.53.1"
tempfile = "3.27.0"
windows-sys = "0.61.2"
windows = "0.62.2"
jsonschema = { version = "0.49.9", default-features = false }
schemars = "1.2.2"
serde_json = "1.0.151"
sha2 = "0.11.0"
zeroize = "1.8.2"
pkg-config = "0.3.34"
