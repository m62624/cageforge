[package]
name = "cageforge-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Linux native backend for Cageforge process sandboxing"
readme = "README.md"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[features]
default = []
bundled-bubblewrap = ["dep:cageforge-bwrap"]

[lib]
name = "cageforge_linux"
path = "src/lib.rs"

[target.'cfg(target_os = "linux")'.dependencies]
cageforge-backend-api.workspace = true
cageforge-bwrap = { workspace = true, optional = true }
cageforge-command.workspace = true
cageforge-network-proxy = { workspace = true, features = ["runtime"] }
cageforge-path.workspace = true
cageforge-policy.workspace = true
cageforge-policy-compose.workspace = true
command-fds.workspace = true
getrandom.workspace = true
libc.workspace = true
seccompiler.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "rt", "sync"] }

[dev-dependencies]
cageforge-config.workspace = true
pretty_assertions.workspace = true

[lints]
workspace = true
