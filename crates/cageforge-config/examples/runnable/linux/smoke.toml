# Runnable Linux smoke profile. Run from the repository root with:
# cargo run --locked -p cageforge-cli --no-default-features --features linux-bundled-bubblewrap -- \
#   run --config crates/cageforge-config/examples/runnable/linux/smoke.toml
default_profile = "smoke"

[profiles.smoke]
workspace_roots = { "." = true }

[profiles.smoke.filesystem]
mode = "restricted"
rules = [
  { target = "minimal", access = "read" },
  { target = "workspace-root", access = "write" },
]

[profiles.smoke.network]
mode = "disabled"

[profiles.smoke.command]
program = "/bin/echo"
args = ["cageforge-linux-smoke"]
