# Runnable Windows smoke profile. Provision the backend once, then run from
# the repository root with:
# cargo run --locked -p cageforge-cli -- \
#   run --config crates/cageforge-config/examples/runnable/windows/smoke.toml
default_profile = "smoke"

[profiles.smoke]
workspace_roots = { "." = true }

[profiles.smoke.approval]
mode = "preflight"
timeout_ms = 10000
on_timeout = "deny"
persistence = "session"

[profiles.smoke.filesystem]
mode = "restricted"
rules = [
  { target = "minimal", access = "read" },
  { target = "workspace-root", access = "write" },
]

[profiles.smoke.network]
mode = "disabled"

[profiles.smoke.command]
program = "C:/Windows/System32/cmd.exe"
args = ["/d", "/c", "echo", "cageforge-windows-smoke"]
