[package]
name = "cageforge"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Cross-platform Rust sandbox for AI agents and untrusted code"
repository.workspace = true
readme = "README.md"

[package.metadata.dist]
dist = false

[package.metadata.docs.rs]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[features]
default = []
config = ["dep:cageforge-config"]
network-runtime = ["cageforge-network-proxy/runtime"]
linux-bundled-bubblewrap = ["cageforge-linux/bundled-bubblewrap"]

[dependencies]
thiserror.workspace = true
cageforge-backend-api.workspace = true
cageforge-command.workspace = true
cageforge-network-proxy = { workspace = true, default-features = false }
cageforge-path.workspace = true
cageforge-policy.workspace = true
cageforge-policy-compose.workspace = true
cageforge-permissions.workspace = true
sha2.workspace = true
cageforge-config = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
cageforge-linux.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
cageforge-windows.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
cageforge-macos.workspace = true

[lints]
workspace = true
