[package]
name = "cageforge-macos"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "macOS native backend for Cageforge process sandboxing"
readme = "README.md"

[package.metadata.dist]
dist = false

[package.metadata.docs.rs]
targets = ["x86_64-apple-darwin", "aarch64-apple-darwin"]

[lib]
name = "cageforge_macos"
path = "src/lib.rs"

[[bin]]
name = "cageforge-macos-helper"
path = "src/bin/cageforge-macos-helper.rs"

[target.'cfg(target_os = "macos")'.dependencies]
cageforge-backend-api.workspace = true
cageforge-command.workspace = true
cageforge-network-proxy = { workspace = true, features = ["runtime"] }
cageforge-path.workspace = true
cageforge-policy.workspace = true
cageforge-policy-compose.workspace = true
libc.workspace = true
block2.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
