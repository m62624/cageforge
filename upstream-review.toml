# Read-only upstream tracking configuration.
#
# The commit is metadata only. No upstream source snapshot is stored in this
# repository. The baseline is intentionally frozen until a deliberate manual
# Cageforge review selects a newer Codex commit.

[upstream]
repository = "https://github.com/openai/codex.git"
path = "../codex"
branch = "main"
last_adapted_commit = "c6058ccaa91ab17159cf805bf4d6d4edd87fe5fc"

[[scope]]
name = "cageforge-policy"
upstream_paths = [
    "codex-rs/protocol/src/permissions.rs",
    "codex-rs/protocol/src/models.rs",
    "codex-rs/protocol/src/protocol.rs",
    "codex-rs/sandboxing/src/policy_transforms.rs",
    "codex-rs/network-proxy/src/policy.rs",
]
local_paths = ["crates/cageforge-policy/"]

[[scope]]
name = "cageforge-command"
upstream_paths = [
    "codex-rs/app-server-protocol/src/protocol/v2/command_exec.rs",
    "codex-rs/app-server-protocol/src/protocol/v2/process.rs",
    "codex-rs/protocol/src/models.rs",
    "codex-rs/protocol/src/config_types.rs",
    "codex-rs/protocol/src/shell_environment.rs",
    "codex-rs/sandboxing/src/spawn.rs",
    "codex-rs/core/src/sandboxing/mod.rs",
    "codex-rs/core/src/spawn.rs",
    "codex-rs/core/src/exec.rs",
    "codex-rs/core/src/exec_env.rs",
]
local_paths = ["crates/cageforge-command/"]

[[scope]]
name = "cageforge-config"
upstream_paths = [
    "codex-rs/config/src/config_toml.rs",
    "codex-rs/config/src/merge.rs",
    "codex-rs/config/src/permissions_toml.rs",
    "codex-rs/config/src/shell_environment_policy.rs",
    "codex-rs/protocol/src/config_types.rs",
    "codex-rs/protocol/src/shell_environment.rs",
    "codex-rs/core/src/config/permissions.rs",
    "codex-rs/core/src/config/mod.rs",
    "codex-rs/core/src/config/resolved_permission_profile.rs",
    "codex-rs/core/src/environment_selection.rs",
    "codex-rs/core/src/exec_env.rs",
]
local_paths = ["crates/cageforge-config/"]
