name: CI

on:
  # Keep pull_request unfiltered so a required status is always created,
  # including for documentation-only changes.
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      scope:
        description: Check scope
        required: true
        default: auto
        type: choice
        options: [auto, default, full]

permissions:
  contents: read
  pull-requests: read

concurrency:
  # A newer commit supersedes an older run for the same branch or PR.
  group: cageforge-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Current runners for portable checks:
#   ubuntu-latest
#   windows-latest
#   macos-latest
#
# Reserved runner labels for future native backends and release builds:
#   ubuntu-24.04       — Linux x64
#   ubuntu-24.04-arm   — Linux ARM64
#   macos-26-intel     — macOS Intel
#   macos-26           — macOS Apple Silicon
#   windows-2025       — Windows x64/release host
#   windows-11-arm     — Windows ARM64
#
# CI routing algorithm:
# 1. Common components run on Linux, macOS, and Windows for every PR and main
#    push. The package list excludes native sandbox enforcement crates.
# 2. A changed common component, workspace dependency, CI file, or other shared
#    input selects every available native sandbox job.
# 3. A native-only change selects only the matching native sandbox job.
# 4. Linux sandbox enforcement always runs in the trusted QEMU/KVM workflow.
# 5. Labeler keeps conventional and release labels only; it does not route CI.

jobs:
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      linux_native: ${{ steps.classify.outputs.linux_native }}
      macos_native: ${{ steps.classify.outputs.macos_native }}
      windows_native: ${{ steps.classify.outputs.windows_native }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: classify
        name: Classify changed paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MANUAL_SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail

          mode=default
          linux_native=false
          macos_native=false
          windows_native=false
          shared_change=false
          changed_paths=()

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            case "${MANUAL_SCOPE:-auto}" in
              full) shared_change=true ;;
              default|auto) ;;
              *) echo "Unknown scope: ${MANUAL_SCOPE}" >&2; exit 1 ;;
            esac
          else
            if [[ "$BASE_SHA" =~ ^0+$ ]]; then
              mapfile -t changed_paths < <(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA")
            else
              mapfile -t changed_paths < <(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")
            fi
          fi

          for path in "${changed_paths[@]}"; do
            case "$path" in
              crates/cageforge-linux/*|crates/cageforge-bwrap/*)
                linux_native=true
                ;;
              crates/cageforge-macos/*)
                macos_native=true
                ;;
              crates/cageforge-windows/*)
                windows_native=true
                ;;
              crates/*)
                shared_change=true
                ;;
              *)
                shared_change=true
                ;;
            esac
          done

          if [[ "$shared_change" == true ]]; then
            linux_native=true
            macos_native=true
            windows_native=true
            mode=shared
          elif [[ "$linux_native" == true || "$macos_native" == true || "$windows_native" == true ]]; then
            mode=native
          fi

          {
            echo "mode=${mode}"
            echo "linux_native=${linux_native}"
            echo "macos_native=${macos_native}"
            echo "windows_native=${windows_native}"
          } >> "$GITHUB_OUTPUT"

  common-components:
    name: "common components (build target: ${{ matrix.target_name }})"
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_name: Linux
            os: ubuntu-24.04
          - target_name: macOS
            os: macos-latest
          - target_name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: >-
          cargo fmt
          -p cageforge-backend-api
          -p cageforge-core
          -p cageforge-command
          -p cageforge-config
          -p cageforge-network-proxy
          -p cageforge-path
          -p cageforge-policy
          -p cageforge-policy-compose
          -p cageforge-upstream-review
          -- --check
      - name: Clippy for common components
        run: >-
          cargo clippy
          -p cageforge-backend-api
          -p cageforge-core
          -p cageforge-command
          -p cageforge-config
          -p cageforge-network-proxy
          -p cageforge-path
          -p cageforge-policy
          -p cageforge-policy-compose
          -p cageforge-upstream-review
          --all-targets -- -D warnings
      - name: Test common components
        run: >-
          cargo test
          -p cageforge-backend-api
          -p cageforge-core
          -p cageforge-command
          -p cageforge-config
          -p cageforge-network-proxy
          -p cageforge-path
          -p cageforge-policy
          -p cageforge-policy-compose
          -p cageforge-upstream-review
      - name: Lint network proxy without runtime feature
        run: >-
          cargo clippy
          -p cageforge-network-proxy
          --no-default-features
          --all-targets -- -D warnings
      - name: Test network proxy without runtime feature
        run: cargo test -p cageforge-network-proxy --no-default-features
      - name: Check common component documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: >-
          cargo doc
          -p cageforge-backend-api
          -p cageforge-core
          -p cageforge-command
          -p cageforge-config
          -p cageforge-network-proxy
          -p cageforge-path
          -p cageforge-policy
          -p cageforge-policy-compose
          -p cageforge-upstream-review
          --no-deps

  native-linux:
    name: Linux sandbox (QEMU/KVM)
    needs: changes
    if: needs.changes.outputs.linux_native == 'true'
    uses: m62624/cageforge/.github/workflows/native-linux-vm.yml@main
    with:
      pr_number: ${{ github.event.pull_request.number || '' }}
      expected_sha: ${{ github.event.pull_request.head.sha || github.sha }}

  native-macos:
    name: macOS sandbox (native macOS)
    needs: changes
    if: needs.changes.outputs.macos_native == 'true'
    # TODO: use the dedicated macOS runner when cageforge-macos is introduced.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --package cageforge-core --package cageforge-macos -- --check
      - run: cargo clippy -p cageforge-core -p cageforge-macos --all-targets -- -D warnings
      - run: cargo test -p cageforge-core -p cageforge-macos

  native-windows:
    name: Windows sandbox (native Windows)
    needs: changes
    if: needs.changes.outputs.windows_native == 'true'
    # TODO: use the dedicated Windows runner when cageforge-windows is introduced.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --package cageforge-core --package cageforge-windows -- --check
      - run: cargo clippy -p cageforge-core -p cageforge-windows --all-targets -- -D warnings
      - run: cargo test -p cageforge-core -p cageforge-windows

  feature-surface:
    name: "feature combinations (build target: Linux)"
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Install bundled Bubblewrap build requirements
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcap-dev pkg-config
      # Keep these explicit. Workspace feature unification means that a
      # workspace-wide --no-default-features run can still enable the proxy's
      # runtime through cageforge-linux's target dependency.
      - name: Lint Linux library and helper binary in every feature mode
        run: |
          cargo clippy -p cageforge-bwrap --all-targets -- -D warnings
          cargo clippy -p cageforge-linux --lib --no-default-features --all-targets -- -D warnings
          cargo clippy -p cageforge-linux --lib --features bundled-bubblewrap --all-targets -- -D warnings
          cargo clippy -p cageforge-linux --lib --all-features --all-targets -- -D warnings
          cargo clippy -p cageforge-linux --bin cageforge-linux-helper --no-default-features -- -D warnings
          cargo clippy -p cageforge-linux --bin cageforge-linux-helper --features bundled-bubblewrap -- -D warnings
          cargo clippy -p cageforge-linux --bin cageforge-linux-helper --all-features -- -D warnings
      - name: Test Linux library and helper binary in every feature mode
        run: |
          cargo test -p cageforge-bwrap -p cageforge-linux --lib --no-default-features
          cargo test -p cageforge-linux --lib --features bundled-bubblewrap
          cargo test -p cageforge-linux --lib --all-features
      - name: Lint network proxy runtime and configuration-only modes
        run: |
          cargo clippy -p cageforge-network-proxy --no-default-features --all-targets -- -D warnings
          cargo clippy -p cageforge-network-proxy --features runtime --all-targets -- -D warnings
          cargo clippy -p cageforge-network-proxy --all-features --all-targets -- -D warnings
      - name: Test network proxy runtime and configuration-only modes
        run: |
          cargo test -p cageforge-network-proxy --all-features --all-targets
          cargo test -p cageforge-network-proxy --features runtime --all-targets
          cargo test -p cageforge-network-proxy --no-default-features --all-targets
      - name: Check Linux documentation in every public feature mode
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc -p cageforge-bwrap -p cageforge-linux --no-deps
          cargo doc -p cageforge-linux --features bundled-bubblewrap --no-deps
          cargo doc -p cageforge-linux --all-features --no-deps
      - name: Cross-check Windows library, helper, and proxy surfaces
        run: |
          cargo check -p cageforge-linux --target x86_64-pc-windows-msvc --lib --all-targets
          cargo check -p cageforge-linux --target x86_64-pc-windows-msvc --bin cageforge-linux-helper
          cargo check -p cageforge-network-proxy --target x86_64-pc-windows-msvc --all-features --all-targets
          cargo check -p cageforge-network-proxy --target x86_64-pc-windows-msvc --no-default-features --all-targets

  coverage-portable:
    name: "portable coverage (build target: Linux)"
    needs: [changes, common-components]
    # TODO: Re-enable this mandatory metric after the project agrees on the
    # coverage policy and the right report destination. The intended gate is
    # at least 90 percent for the portable packages listed below.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Pin the installer action so the coverage toolchain remains reproducible
      # and does not turn a routine CI run into a cargo install build.
      - uses: taiki-e/install-action@v2.85.13
        with:
          tool: cargo-tarpaulin
      - name: Generate portable coverage
        run: >-
          cargo tarpaulin
          --locked
          --ignore-config
          --timeout 300
          --fail-under 90
          --out Xml
          --output-dir coverage
          --exclude-files
          'crates/*/tests/*'
          'crates/cageforge-bwrap/**'
          'crates/cageforge-linux/**'
          'tools/*'
          --packages
          cageforge-backend-api
          cageforge-core
          cageforge-command
          cageforge-config
          cageforge-network-proxy
          cageforge-path
          cageforge-policy
          cageforge-policy-compose
          cageforge-upstream-review
          -- --test-threads=1
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: cageforge-portable-coverage
          path: coverage/*.xml
          if-no-files-found: error

      # TODO: add a separate Linux-native coverage measurement once the tool
      # can attribute code across the Bubblewrap/helper process boundary. Do
      # not merge that number into portable coverage or pretend compilation
      # on another OS replaces native enforcement coverage.

  ci-pass:
    name: CI passed
    if: always()
    needs:
      [changes, common-components, native-linux, native-macos, native-windows, feature-surface, coverage-portable]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a selected job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "A selected CI job failed or was cancelled."
          exit 1
      - name: All selected checks passed
        run: echo "Cageforge CI routing and selected checks passed."
