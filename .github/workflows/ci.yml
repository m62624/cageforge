name: CI

on:
  # Keep pull_request unfiltered so a required status is always created,
  # including for documentation-only changes.
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      scope:
        description: Check scope
        required: true
        default: auto
        type: choice
        options: [auto, default, full]

permissions:
  contents: read

concurrency:
  # A newer commit supersedes an older run for the same branch or PR.
  group: cageforge-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Current runners for portable checks:
#   ubuntu-latest
#   windows-latest
#   macos-latest
#
# Reserved runner labels for future native backends and release builds:
#   ubuntu-24.04       — Linux x64
#   ubuntu-24.04-arm   — Linux ARM64
#   macos-26-intel     — macOS Intel
#   macos-26           — macOS Apple Silicon
#   windows-2025       — Windows x64/release host
#   windows-11-arm     — Windows ARM64
#
# CI routing algorithm (TODO: keep this synchronized with labeler.yml):
# 1. The portable crates are the current default surface. Run their fmt, clippy,
#    tests, and docs on one default Linux runner. Exclude cageforge-core and all
#    future native sandbox crates from this job.
# 2. A change to any portable crate, cageforge-core, workspace dependency or CI
#    metadata is a shared-contract change. Run the complete workspace on Linux,
#    macOS, and Windows immediately.
# 3. A change limited to one native sandbox crate selects exactly cageforge-core
#    and that native crate on its operating system. Do not run unrelated native
#    crates. The same routing is exposed as ci-<os>-quality labels.
# 4. When native crates and dedicated hardware are available, replace the
#    placeholder native package names and runner labels below. Keep the package
#    selection and the OS mapping explicit; never silently fall back to a broad
#    workspace check for a native-only change.
# 5. If several native crates change, run cageforge-core plus each changed native
#    crate on its matching OS. If cageforge-core changes, use the complete matrix.
# 6. Update the path classifier and labeler together whenever a crate is added,
#    renamed, or moved between portable and native ownership.
# 7. Configure branch protection to require the stable `CI passed` check. Do not
#    require mode-specific jobs, because skipped jobs are intentional for other
#    change classes.
# 8. Keep the feature-surface job unconditional: it checks each native library
#    and helper binary in every declared feature mode, plus the proxy's
#    runtime/configuration-only modes and cross-target compilation. This catches
#    feature unification and lib/bin drift before a native backend is selected.

jobs:
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      linux_native: ${{ steps.classify.outputs.linux_native }}
      macos_native: ${{ steps.classify.outputs.macos_native }}
      windows_native: ${{ steps.classify.outputs.windows_native }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: classify
        name: Classify changed paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MANUAL_SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail

          mode=default
          linux_native=false
          macos_native=false
          windows_native=false

          if [[ "$EVENT_NAME" == "push" ]]; then
            mode=full
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            case "${MANUAL_SCOPE:-auto}" in
              full) mode=full ;;
              default|auto) mode=default ;;
              *) echo "Unknown scope: ${MANUAL_SCOPE}" >&2; exit 1 ;;
            esac
          else
            mapfile -t changed_paths < <(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")
            shared_change=false

            for path in "${changed_paths[@]}"; do
              case "$path" in
                crates/cageforge-linux/*)
                  linux_native=true
                  ;;
                crates/cageforge-bwrap/*)
                  linux_native=true
                  ;;
                crates/cageforge-macos/*)
                  macos_native=true
                  ;;
                crates/cageforge-windows/*)
                  windows_native=true
                  ;;
                crates/*)
                  # A portable crate is shared by every future backend.
                  shared_change=true
                  ;;
                *)
                  # Anything outside crates/ can affect the build, policy, CI,
                  # documentation contract, or release process. Be conservative
                  # and run every OS before merge.
                  shared_change=true
                  ;;
              esac
            done

            if [[ "$shared_change" == true ]]; then
              mode=full
            elif [[ "$linux_native" == true || "$macos_native" == true || "$windows_native" == true ]]; then
              mode=native
            fi
          fi

          {
            echo "mode=${mode}"
            echo "linux_native=${linux_native}"
            echo "macos_native=${macos_native}"
            echo "windows_native=${windows_native}"
          } >> "$GITHUB_OUTPUT"

  portable-default:
    name: portable fmt + clippy + test (Linux)
    needs: changes
    if: needs.changes.outputs.mode == 'default'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        # Keep this list limited to the current portable packages. Add a new
        # portable package here when it becomes part of the default surface.
        run: >-
          cargo fmt
          -p cageforge-backend-api
          -p cageforge-command
          -p cageforge-config
          -p cageforge-network-proxy
          -p cageforge-path
          -p cageforge-policy
          -p cageforge-policy-compose
          -p cageforge-upstream-review
          -- --check
      - name: Clippy for portable crates
        run: >-
          cargo clippy
          -p cageforge-backend-api
          -p cageforge-command
          -p cageforge-config
          -p cageforge-network-proxy
          -p cageforge-path
          -p cageforge-policy
          -p cageforge-policy-compose
          -p cageforge-upstream-review
          --all-targets -- -D warnings
      - name: Test portable crates
        run: >-
          cargo test
          -p cageforge-backend-api
          -p cageforge-command
          -p cageforge-config
          -p cageforge-network-proxy
          -p cageforge-path
          -p cageforge-policy
          -p cageforge-policy-compose
          -p cageforge-upstream-review
      - name: Check network proxy without runtime feature
        run: >-
          cargo check
          -p cageforge-network-proxy
          --no-default-features
          --all-targets
      - name: Lint network proxy without runtime feature
        run: >-
          cargo clippy
          -p cageforge-network-proxy
          --no-default-features
          --all-targets -- -D warnings
      - name: Test network proxy without runtime feature
        run: cargo test -p cageforge-network-proxy --no-default-features
      - name: Check portable documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: >-
          cargo doc
          -p cageforge-backend-api
          -p cageforge-command
          -p cageforge-config
          -p cageforge-network-proxy
          -p cageforge-path
          -p cageforge-policy
          -p cageforge-policy-compose
          -p cageforge-upstream-review
          --no-deps

  full-matrix:
    name: full workspace (${{ matrix.os_name }})
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: Linux
            os: ubuntu-24.04
          - os_name: macOS
            os: macos-latest
          - os_name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Build bundled Bubblewrap on Linux
        if: matrix.os_name == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcap-dev pkg-config
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          test "$(sysctl -n kernel.unprivileged_userns_clone)" = "1"
          unshare --user --map-root-user --mount-proc true
          cargo run -p cageforge-bwrap -- --output "$RUNNER_TEMP/cageforge-resources/bwrap"
          "$RUNNER_TEMP/cageforge-resources/bwrap" \
            --die-with-parent \
            --unshare-user \
            --unshare-pid \
            --unshare-net \
            --ro-bind / / \
            --proc /proc \
            --dev /dev \
            /usr/bin/true
          echo "CAGEFORGE_BWRAP_TEST_RESOURCE_DIR=$RUNNER_TEMP/cageforge-resources" >> "$GITHUB_ENV"
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  native-linux:
    name: Linux core + native sandbox
    needs: changes
    if: needs.changes.outputs.mode == 'native' && needs.changes.outputs.linux_native == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Build bundled Bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcap-dev pkg-config
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          test "$(sysctl -n kernel.unprivileged_userns_clone)" = "1"
          unshare --user --map-root-user --mount-proc true
          cargo run -p cageforge-bwrap -- --output "$RUNNER_TEMP/cageforge-resources/bwrap"
          "$RUNNER_TEMP/cageforge-resources/bwrap" \
            --die-with-parent \
            --unshare-user \
            --unshare-pid \
            --unshare-net \
            --ro-bind / / \
            --proc /proc \
            --dev /dev \
            /usr/bin/true
          echo "CAGEFORGE_BWRAP_TEST_RESOURCE_DIR=$RUNNER_TEMP/cageforge-resources" >> "$GITHUB_ENV"
      - run: cargo fmt --package cageforge-bwrap --package cageforge-core --package cageforge-linux -- --check
      - run: cargo clippy -p cageforge-bwrap -p cageforge-core -p cageforge-linux --all-targets -- -D warnings
      - run: cargo test -p cageforge-bwrap -p cageforge-core -p cageforge-linux

  native-macos:
    name: macOS core + native sandbox
    needs: changes
    if: needs.changes.outputs.mode == 'native' && needs.changes.outputs.macos_native == 'true'
    # TODO: use the dedicated macOS runner when cageforge-macos is introduced.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --package cageforge-core --package cageforge-macos -- --check
      - run: cargo clippy -p cageforge-core -p cageforge-macos --all-targets -- -D warnings
      - run: cargo test -p cageforge-core -p cageforge-macos

  native-windows:
    name: Windows core + native sandbox
    needs: changes
    if: needs.changes.outputs.mode == 'native' && needs.changes.outputs.windows_native == 'true'
    # TODO: use the dedicated Windows runner when cageforge-windows is introduced.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --package cageforge-core --package cageforge-windows -- --check
      - run: cargo clippy -p cageforge-core -p cageforge-windows --all-targets -- -D warnings
      - run: cargo test -p cageforge-core -p cageforge-windows

  feature-surface:
    name: feature and lib/bin surface (Linux)
    needs: changes
    if: needs.changes.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      # Keep these explicit. Workspace feature unification means that a
      # workspace-wide --no-default-features run can still enable the proxy's
      # runtime through cageforge-linux's target dependency.
      - name: Check Linux library and helper binary in both feature modes
        run: |
          cargo check -p cageforge-linux --lib --all-features
          cargo check -p cageforge-linux --lib --no-default-features
          cargo check -p cageforge-linux --bin cageforge-linux-helper --all-features
          cargo check -p cageforge-linux --bin cageforge-linux-helper --no-default-features
          cargo test -p cageforge-linux --lib --all-features
          cargo test -p cageforge-linux --lib --no-default-features
      - name: Check network proxy runtime and configuration-only modes
        run: |
          cargo check -p cageforge-network-proxy --all-features --all-targets
          cargo check -p cageforge-network-proxy --no-default-features --all-targets
          cargo clippy -p cageforge-network-proxy --all-features --all-targets -- -D warnings
          cargo clippy -p cageforge-network-proxy --no-default-features --all-targets -- -D warnings
          cargo test -p cageforge-network-proxy --all-features --all-targets
          cargo test -p cageforge-network-proxy --no-default-features --all-targets
      - name: Cross-check Windows library, helper, and proxy surfaces
        run: |
          cargo check -p cageforge-linux --target x86_64-pc-windows-msvc --lib --all-targets
          cargo check -p cageforge-linux --target x86_64-pc-windows-msvc --bin cageforge-linux-helper
          cargo check -p cageforge-network-proxy --target x86_64-pc-windows-msvc --all-features --all-targets
          cargo check -p cageforge-network-proxy --target x86_64-pc-windows-msvc --no-default-features --all-targets

  coverage-portable:
    name: portable coverage (Linux)
    needs: [changes, portable-default, full-matrix]
    # Coverage follows the fast portable checks in default mode and the full
    # matrix in shared-contract mode. Native-only changes do not run this
    # portable metric: their enforcement is tested by the matching native job.
    if: >-
      always() &&
      (needs.changes.outputs.mode == 'default' || needs.changes.outputs.mode == 'full') &&
      (needs.portable-default.result == 'success' || needs.full-matrix.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Pin the installer action so the coverage toolchain remains reproducible
      # and does not turn a routine CI run into a cargo install build.
      - uses: taiki-e/install-action@v2.85.13
        with:
          tool: cargo-tarpaulin
      - name: Generate portable coverage
        run: >-
          cargo tarpaulin
          --locked
          --ignore-config
          --timeout 300
          --fail-under 90
          --out Xml
          --output-dir coverage
          --exclude-files
          'crates/*/tests/*'
          'crates/cageforge-bwrap/**'
          'crates/cageforge-linux/**'
          'tools/*'
          --packages
          cageforge-backend-api
          cageforge-command
          cageforge-config
          cageforge-network-proxy
          cageforge-path
          cageforge-policy
          cageforge-policy-compose
          cageforge-upstream-review
          -- --test-threads=1
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: cageforge-portable-coverage
          path: coverage/*.xml
          if-no-files-found: error

      # TODO: add a separate Linux-native coverage measurement once the tool
      # can attribute code across the Bubblewrap/helper process boundary. Do
      # not merge that number into portable coverage or pretend compilation
      # on another OS replaces native enforcement coverage.

  ci-pass:
    name: CI passed
    if: always()
    needs:
      [changes, portable-default, full-matrix, native-linux, native-macos, native-windows, feature-surface, coverage-portable]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a selected job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "A selected CI job failed or was cancelled."
          exit 1
      - name: All selected checks passed
        run: echo "Cageforge CI routing and selected checks passed."
