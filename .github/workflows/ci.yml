name: CI

on:
  # Keep the required status for normal PR activity and rerun it when a
  # maintainer manually adds or removes a sandbox label.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      scope:
        description: Check scope
        required: true
        default: auto
        type: choice
        options: [auto, default, full]
      sandbox:
        description: Optional sandbox lane to run manually
        required: true
        default: none
        type: choice
        options: [none, linux, macos, windows, all]
  workflow_call:
    inputs:
      ref:
        description: Ref to check for release validation
        required: false
        type: string
      full:
        description: Run every native sandbox and CLI target for release validation
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read

concurrency:
  # A newer commit supersedes an older run for the same branch or PR.
  group: cageforge-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Current runners for common-component checks:
#   ubuntu-24.04
#   windows-latest
#   macos-15 — native macOS Seatbelt
#
# Current native sandbox runners:
#   Linux x64       — disposable QEMU/KVM guest on ubuntu-24.04
#   Linux ARM64     — cross-build on ubuntu-24.04
#   Windows x64     — windows-2025
#
# Release CLI artifact matrix:
#   ubuntu-24.04       — Linux x64
#   ubuntu-24.04 + Zig  — Linux ARM64
#   macos-26-intel     — macOS Intel
#   macos-26           — macOS Apple Silicon
#   windows-2025       — Windows x64 and ARM64 targets
#
# CI routing algorithm:
# 1. Main is the full quality gate: common components and their feature
#    combinations run on every target, and every sandbox lane is selected.
# 2. PRs always run common components and their feature combinations on Linux,
#    macOS, and Windows.
# 3. A PR selects each sandbox whose crate or transitive workspace dependency
#    changed. Workspace-wide inputs and shared CI changes select every sandbox.
# 4. Manual PR labels sandbox-linux, sandbox-macos, and sandbox-windows force
#    the requested lane. Labels are never applied automatically by the labeler.
# 5. Sandbox crates never enter the common-component jobs. The Windows sandbox
#    lane runs every cageforge-windows feature combination and its native tests;
#    macOS still reports its missing native backend in its own sandbox job.
# 6. The JVM binding is scheduled only for binding/facade/backend dependency
#    changes (or full/main validation), and runs after all selected Rust jobs.
#
jobs:
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      linux_sandbox: ${{ steps.classify.outputs.linux_sandbox }}
      macos_sandbox: ${{ steps.classify.outputs.macos_sandbox }}
      windows_sandbox: ${{ steps.classify.outputs.windows_sandbox }}
      java_binding: ${{ steps.classify.outputs.java_binding }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - id: classify
        name: Classify changed paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MANUAL_SCOPE: ${{ inputs.scope }}
          MANUAL_SANDBOX: ${{ inputs.sandbox }}
          FORCE_FULL: ${{ inputs.full || false }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          set -euo pipefail

          mode=default
          linux_sandbox=false
          macos_sandbox=false
          windows_sandbox=false
          java_binding=false
          shared_change=false
          changed_paths=()
          manual_linux=false
          manual_macos=false
          manual_windows=false
          root_manifest_change=false

          # Explicit workspace-package -> native-lane map. Keep this table
          # synchronized with each backend manifest, including its test-only
          # workspace dependencies. A changed package selects only the native
          # sandboxes that consume it; common-components still runs everywhere.
          #
          # Linux: cageforge-linux and cageforge-bwrap, plus the portable
          # crates used by Linux's runtime and integration tests.
          linux_sandbox_packages=(
            cageforge
            cageforge-cli
            cageforge-linux
            cageforge-bwrap
            cageforge-config
            cageforge-backend-api
            cageforge-command
            cageforge-network-proxy
            cageforge-path
            cageforge-policy
            cageforge-policy-compose
          )
          # Windows: cageforge-windows, the CLI's Windows feature, and the
          # portable crates used by their runtime and integration tests.
          windows_sandbox_packages=(
            cageforge
            cageforge-cli
            cageforge-windows
            cageforge-config
            cageforge-backend-api
            cageforge-command
            cageforge-network-proxy
            cageforge-path
            cageforge-policy
            cageforge-policy-compose
          )
          # macOS: cageforge-macos plus the portable backend-facing crates
          # shared by every native backend.
          macos_sandbox_packages=(
            cageforge
            cageforge-cli
            cageforge-macos
            cageforge-config
            cageforge-backend-api
            cageforge-command
            cageforge-network-proxy
            cageforge-path
            cageforge-policy
            cageforge-policy-compose
          )
          # Packages consumed by the JVM binding through the public facade.
          # Unrelated crate-only PRs can therefore skip the final JVM stage.
          java_binding_packages=(
            cageforge
            cageforge-bwrap
            cageforge-linux
            cageforge-macos
            cageforge-windows
            cageforge-config
            cageforge-backend-api
            cageforge-command
            cageforge-network-proxy
            cageforge-path
            cageforge-policy
            cageforge-policy-compose
          )

          for label in ${PR_LABELS:-}; do
            case "$label" in
              sandbox-linux) manual_linux=true ;;
              sandbox-macos) manual_macos=true ;;
              sandbox-windows) manual_windows=true ;;
            esac
          done

          case "${MANUAL_SANDBOX:-none}" in
            none) ;;
            linux) manual_linux=true ;;
            macos) manual_macos=true ;;
            windows) manual_windows=true ;;
            all)
              manual_linux=true
              manual_macos=true
              manual_windows=true
              ;;
            *) echo "Unknown sandbox lane: ${MANUAL_SANDBOX}" >&2; exit 1 ;;
          esac

          if [[ "$FORCE_FULL" == true ]]; then
            linux_sandbox=true
            macos_sandbox=true
            windows_sandbox=true
            java_binding=true
            mode=release
          elif [[ "$EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            linux_sandbox=true
            macos_sandbox=true
            windows_sandbox=true
            java_binding=true
            mode=main
          elif [[ "$EVENT_NAME" == "workflow_call" ]]; then
            linux_sandbox=true
            macos_sandbox=true
            windows_sandbox=true
            java_binding=true
            mode=called
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            case "${MANUAL_SCOPE:-auto}" in
              full)
                linux_sandbox=true
                macos_sandbox=true
                windows_sandbox=true
                java_binding=true
                mode=manual-full
                ;;
              default|auto) ;;
              *) echo "Unknown scope: ${MANUAL_SCOPE}" >&2; exit 1 ;;
            esac
          else
            if [[ "$BASE_SHA" =~ ^0+$ ]]; then
              mapfile -t changed_paths < <(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA")
            else
              mapfile -t changed_paths < <(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")
            fi
          fi

          package_in_list() {
            local package="$1"
            shift
            local candidate
            for candidate in "$@"; do
              [[ "$candidate" == "$package" ]] && return 0
            done
            return 1
          }

          for path in "${changed_paths[@]}"; do
            case "$path" in
              .github/workflows/*)
                java_binding=true
                mapfile -t workflow_jobs < <(
                  git diff --unified=0 "${BASE_SHA}...${HEAD_SHA}" -- "$path" \
                    | sed -n 's/^+  \([[:alnum:]_-][[:alnum:]_-]*\):$/\1/p'
                )
                if ((${#workflow_jobs[@]} == 0)); then
                  shared_change=true
                else
                  for job in "${workflow_jobs[@]}"; do
                    case "$job" in
                      native-linux|native-linux-arm64|linux-bwrap-resources)
                        linux_sandbox=true
                        ;;
                      native-macos)
                        macos_sandbox=true
                        ;;
                      native-windows)
                        windows_sandbox=true
                        ;;
                      changes|common-components|ci-pass|coverage-portable)
                        shared_change=true
                        ;;
                      *)
                        shared_change=true
                        ;;
                    esac
                  done
                fi
                ;;
              Cargo.toml)
                root_manifest_change=true
                java_binding=true
                ;;
              Cargo.lock|rust-toolchain|rust-toolchain.toml|.cargo/*|ci/*)
                shared_change=true
                java_binding=true
                ;;
              *) ;;
            esac

            package=""
            case "$path" in
              crates/bindings/cageforge-java/*)
                package=cageforge-java
                # The JVM adapter exercises every native backend. Select all
                # Rust native lanes before the final Java consumer stage.
                shared_change=true
                java_binding=true
                ;;
              crates/*/*)
                package=${path#crates/}
                package=${package%%/*}
                ;;
              tools/*/*)
                package=${path#tools/}
                package=${package%%/*}
                ;;
            esac
            if [[ -n "$package" ]]; then
              package_in_list "$package" "${linux_sandbox_packages[@]}" && linux_sandbox=true
              package_in_list "$package" "${windows_sandbox_packages[@]}" && windows_sandbox=true
              package_in_list "$package" "${macos_sandbox_packages[@]}" && macos_sandbox=true
              package_in_list "$package" "${java_binding_packages[@]}" && java_binding=true
            fi
          done

          # The root manifest controls workspace-wide dependency resolution.
          # It therefore selects every native lane even when another changed
          # path already selected one narrower lane.
          if [[ "$root_manifest_change" == true ]]; then
            shared_change=true
          fi

          if [[ "$shared_change" == true ]]; then
            linux_sandbox=true
            macos_sandbox=true
            windows_sandbox=true
            mode=shared
          elif [[ "$mode" == default && ("$linux_sandbox" == true || "$macos_sandbox" == true || "$windows_sandbox" == true) ]]; then
            mode=native
          fi

          [[ "$manual_linux" == true ]] && linux_sandbox=true
          [[ "$manual_macos" == true ]] && macos_sandbox=true
          [[ "$manual_windows" == true ]] && windows_sandbox=true
          if [[ "$manual_linux" == true || "$manual_macos" == true || "$manual_windows" == true ]]; then
            mode=manual
          fi

          {
            echo "mode=${mode}"
            echo "linux_sandbox=${linux_sandbox}"
            echo "macos_sandbox=${macos_sandbox}"
            echo "windows_sandbox=${windows_sandbox}"
            echo "java_binding=${java_binding}"
          } >> "$GITHUB_OUTPUT"

  common-components:
    name: "common components (build target: ${{ matrix.target }})"
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Linux
            runner: ubuntu-24.04
          - target: macOS
            runner: macos-latest
          - target: Windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace publication metadata
        if: matrix.target == 'Linux'
        run: ci/check-workspace-metadata.sh
      - name: Install Bubblewrap package verification dependencies
        if: matrix.target == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential pkg-config libcap-dev
      - name: Check workspace packages publish cleanly
        if: matrix.target == 'Linux'
        run: cargo publish --workspace --dry-run --locked
      - name: Check formatting
        if: matrix.target == 'Linux'
        run: >-
          cargo fmt
          -p cageforge-backend-api
          -p cageforge
          -p cageforge-command
          -p cageforge-config
          -p cageforge-network-proxy
          -p cageforge-path
          -p cageforge-policy
          -p cageforge-policy-compose
          -p cageforge-upstream-review
          -p cageforge-cli
          -- --check
      - name: Clippy for common components
        run: >-
          cargo clippy
          -p cageforge-backend-api
          -p cageforge
          -p cageforge-command
          -p cageforge-config
          -p cageforge-network-proxy
          -p cageforge-path
          -p cageforge-policy
          -p cageforge-policy-compose
          -p cageforge-upstream-review
          -p cageforge-cli
          --all-targets -- -D warnings
      - name: Test common components
        run: >-
          cargo test
          -p cageforge-backend-api
          -p cageforge
          -p cageforge-command
          -p cageforge-config
          -p cageforge-network-proxy
          -p cageforge-path
          -p cageforge-policy
          -p cageforge-policy-compose
          -p cageforge-upstream-review
          -p cageforge-cli
      # Keep every public feature mode explicit. Workspace feature unification
      # can otherwise make a nominal --no-default-features check inherit the
      # proxy runtime from another selected package.
      - name: Lint common component feature combinations
        run: |
          set -euo pipefail
          cargo clippy -p cageforge-network-proxy --no-default-features --all-targets -- -D warnings
          cargo clippy -p cageforge-network-proxy --features runtime --all-targets -- -D warnings
          cargo clippy -p cageforge-network-proxy --all-features --all-targets -- -D warnings
          cargo clippy -p cageforge-cli --no-default-features --all-targets -- -D warnings
          cargo clippy -p cageforge-cli --no-default-features --features config --all-targets -- -D warnings
      - name: Test common component feature combinations
        run: |
          set -euo pipefail
          cargo clippy -p cageforge --no-default-features --all-targets -- -D warnings
          cargo clippy -p cageforge --features config --all-targets -- -D warnings
          cargo clippy -p cageforge --features network-runtime --all-targets -- -D warnings
          cargo clippy -p cageforge --all-features --all-targets -- -D warnings
          cargo test -p cageforge --no-default-features --all-targets
          cargo test -p cageforge --features config --all-targets
          cargo test -p cageforge --features network-runtime --all-targets
          cargo test -p cageforge --all-features --all-targets
          cargo test -p cageforge-network-proxy --no-default-features --all-targets
          cargo test -p cageforge-network-proxy --features runtime --all-targets
          cargo test -p cageforge-network-proxy --all-features --all-targets
          cargo test -p cageforge-cli --no-default-features --all-targets
          cargo test -p cageforge-cli --no-default-features --features config --all-targets
      - name: Check common component documentation
        if: matrix.target == 'Linux'
        env:
          RUSTDOCFLAGS: -D warnings
        run: >-
          cargo doc
          -p cageforge-backend-api
          -p cageforge
          -p cageforge-command
          -p cageforge-config
          -p cageforge-network-proxy
          -p cageforge-path
          -p cageforge-policy
          -p cageforge-policy-compose
          -p cageforge-upstream-review
          -p cageforge-cli
          --no-deps

  java-binding:
    name: "Cageforge JVM binding (${{ matrix.target }})"
    # The JVM adapter is a final consumer check. It must not start while any
    # selected Rust component or native backend is still being validated.
    # Skipped native lanes are valid for a narrow PR; failures and cancellations
    # are rejected by the condition below.
    needs: [changes, common-components, native-linux, native-linux-arm64, linux-bwrap-resources, native-macos, native-windows]
    if: ${{ always() && needs.changes.outputs.java_binding == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Linux
            runner: ubuntu-24.04
            feature: linux-bundled-bubblewrap
            helper_package: cageforge-linux
            helper_arguments: "--bin cageforge-linux-helper"
          - target: macOS
            runner: macos-15
            feature: macos
            helper_package: cageforge-macos
            helper_arguments: "--bin cageforge-macos-helper"
          - target: Windows
            runner: windows-2025
            feature: windows
            helper_package: cageforge-windows
            helper_arguments: "--bin cageforge-windows-setup --bin cageforge-windows-command-runner"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux Bubblewrap verification dependencies
        if: matrix.target == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential pkg-config libcap-dev binutils
      - name: Build the pinned Linux Bubblewrap resource
        if: matrix.target == 'Linux'
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          case "$arch" in
            x86_64) resource_arch=x86_64 ;;
            aarch64) resource_arch=aarch64 ;;
            *) echo "unsupported Linux architecture: $arch" >&2; exit 1 ;;
          esac
          output_dir="crates/cageforge-bwrap/assets/linux-$resource_arch"
          mkdir -p "$output_dir"
          cargo run --locked --release -p cageforge-bwrap -- \
            --output "$output_dir/bwrap"
      - name: Check Rust JNI binding formatting
        run: cargo fmt --package cageforge-java -- --check
      - name: Lint Rust JNI binding
        run: cargo clippy --locked -p cageforge-java --no-default-features --features "${{ matrix.feature }}" --all-targets -- -D warnings
      - name: Build Rust JNI binding and native helper
        run: |
          set -euo pipefail
          cargo build --locked --release -p cageforge-java --no-default-features --features "${{ matrix.feature }}"
          cargo build --locked --release -p "${{ matrix.helper_package }}" ${{ matrix.helper_arguments }}
          version="$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "cageforge-java") | .version')"
          test -n "$version" && test "$version" != null
          echo "CAGEFORGE_JVM_VERSION=$version" >> "$GITHUB_ENV"
      - name: Run Java and Kotlin tests and linters
        working-directory: crates/bindings/cageforge-java/jvm
        run: gradle --no-daemon check ktlintCheck
      - name: Stage the locally built native resources
        working-directory: crates/bindings/cageforge-java/jvm
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux)
              native_os=linux
              library=libcageforge_java.so
              ;;
            macOS)
              native_os=macos
              library=libcageforge_java.dylib
              ;;
            Windows)
              native_os=windows
              library=cageforge_java.dll
              ;;
            *)
              echo "unsupported runner OS: $RUNNER_OS" >&2
              exit 1
              ;;
          esac
          case "$(uname -m)" in
            x86_64|amd64) native_arch=x86_64 ;;
            aarch64|arm64) native_arch=aarch64 ;;
            *) echo "unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          target_id="$native_os-$native_arch"
          resource_dir="$PWD/build/native/META-INF/native/$target_id"
          repo_root="$(git rev-parse --show-toplevel)"
          mkdir -p "$resource_dir"
          cp "$repo_root/target/release/$library" "$resource_dir/"
          case "$RUNNER_OS" in
            Linux)
              cp "$repo_root/target/release/cageforge-linux-helper" "$resource_dir/"
              cp "$repo_root/crates/cageforge-bwrap/assets/linux-$native_arch/bwrap" "$resource_dir/"
              cp "$repo_root/crates/cageforge-bwrap/assets/linux-$native_arch/bwrap.sha256" "$resource_dir/"
              ;;
            macOS) cp "$repo_root/target/release/cageforge-macos-helper" "$resource_dir/" ;;
            Windows)
              cp "$repo_root/target/release/cageforge-windows-setup.exe" "$resource_dir/"
              cp "$repo_root/target/release/cageforge-windows-command-runner.exe" "$resource_dir/"
              ;;
          esac
          echo "CAGEFORGE_JVM_EXPECTED_TARGET=$target_id" >> "$GITHUB_ENV"
      - name: Assemble the local JVM artifact
        working-directory: crates/bindings/cageforge-java/jvm
        run: gradle --no-daemon jar -PnativeResourcesDir=build/native -PreleaseVersion="$CAGEFORGE_JVM_VERSION"
      - name: Verify the local JAR contains this runner's native resources
        working-directory: crates/bindings/cageforge-java/jvm
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux) native_os=linux; library=libcageforge_java.so; helper=cageforge-linux-helper ;;
            macOS) native_os=macos; library=libcageforge_java.dylib; helper=cageforge-macos-helper ;;
            Windows) native_os=windows; library=cageforge_java.dll; helper= ;;
            *) echo "unsupported runner OS: $RUNNER_OS" >&2; exit 1 ;;
          esac
          case "$(uname -m)" in
            x86_64|amd64) native_arch=x86_64 ;;
            aarch64|arm64) native_arch=aarch64 ;;
            *) echo "unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          jar_file="build/libs/cageforge-java-$CAGEFORGE_JVM_VERSION.jar"
          jar tf "$jar_file" | grep -F "META-INF/native/$native_os-$native_arch/$library"
          if [[ -n "$helper" ]]; then
            jar tf "$jar_file" | grep -F "META-INF/native/$native_os-$native_arch/$helper"
            if [[ "$native_os" == linux ]]; then
              jar tf "$jar_file" | grep -F "META-INF/native/$native_os-$native_arch/bwrap"
              jar tf "$jar_file" | grep -F "META-INF/native/$native_os-$native_arch/bwrap.sha256"
            fi
          else
            jar tf "$jar_file" | grep -F "META-INF/native/$native_os-$native_arch/cageforge-windows-setup.exe"
            jar tf "$jar_file" | grep -F "META-INF/native/$native_os-$native_arch/cageforge-windows-command-runner.exe"
          fi
      - name: Run a Java consumer against the local JVM artifact
        if: matrix.target != 'Linux'
        working-directory: crates/bindings/cageforge-java/jvm/smoke
        env:
          NATIVE_CACHE: ${{ runner.temp }}/cageforge-java-native-cache
        run: |
          set -euo pipefail
          smoke_log="$RUNNER_TEMP/cageforge-java-smoke.log"
          gradle --no-daemon run \
            -PbindingVersion="$CAGEFORGE_JVM_VERSION" \
            -PnativeCache="$NATIVE_CACHE" 2>&1 | tee "$smoke_log"
          output="$(<"$smoke_log")"
          grep -F "native-target=$CAGEFORGE_JVM_EXPECTED_TARGET" <<<"$output"
          grep -F 'toml-validation=ok' <<<"$output"
          grep -F 'typed-errors=ok' <<<"$output"
          grep -F 'concurrent-instances=ok' <<<"$output"
          grep -F 'consumer-smoke=ok' <<<"$output"
          grep -F 'closed-handles=ok' <<<"$output"
          grep -F 'wait-kill=ok' <<<"$output"
          grep -F 'stream-kill=ok' <<<"$output"
          grep -F 'write-kill=ok' <<<"$output"
          grep -F 'close-kill=ok' <<<"$output"
          grep -F 'async-cancel=ok' <<<"$output"
          grep -F 'stdin-eof=ok' <<<"$output"
          grep -F 'stdio-routing=ok' <<<"$output"

      - name: Package the Linux Java consumer for the QEMU smoke
        if: matrix.target == 'Linux'
        working-directory: crates/bindings/cageforge-java/jvm/smoke
        run: |
          set -euo pipefail
          gradle --no-daemon installDist -PbindingVersion="$CAGEFORGE_JVM_VERSION"
          tar --create --gzip --file="$RUNNER_TEMP/cageforge-java-consumer-smoke.tar.gz" \
            --directory=build/install cageforge-java-consumer-smoke

      - name: Upload the Linux Java consumer for the QEMU smoke
        if: matrix.target == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: cageforge-java-linux-consumer-smoke
          path: ${{ runner.temp }}/cageforge-java-consumer-smoke.tar.gz
          if-no-files-found: error

  java-linux-qemu:
    name: "Cageforge JVM Linux consumer in QEMU"
    needs: [changes, java-binding]
    if: ${{ always() && needs.changes.outputs.java_binding == 'true' && needs.java-binding.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Install QEMU tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes genisoimage qemu-system-x86 qemu-utils

      - name: Verify KVM access
        run: |
          set -euo pipefail
          test -c /dev/kvm || {
            echo "::error title=CAGEFORGE_KVM_UNAVAILABLE::GitHub runner did not expose /dev/kvm"
            exit 86
          }
          sudo chmod 0666 /dev/kvm

      - name: Download the Linux Java consumer
        uses: actions/download-artifact@v4
        with:
          name: cageforge-java-linux-consumer-smoke
          path: ${{ runner.temp }}/cageforge-java-consumer

      - name: Download and verify the pinned Ubuntu guest image
        env:
          CAGEFORGE_VM_IMAGE_URL: https://cloud-images.ubuntu.com/noble/20260814/noble-server-cloudimg-amd64.img
          CAGEFORGE_VM_IMAGE_SHA256: 6e40c07ae715f744f84af0bec76415cc1987dd115b4b8de437818561f01a3733
        run: |
          set -euo pipefail
          image="$RUNNER_TEMP/noble-server-cloudimg-amd64.img"
          curl --fail --silent --show-error --location --retry 3 \
            --max-filesize 1073741824 --max-time 900 \
            "$CAGEFORGE_VM_IMAGE_URL" --output "$image"
          printf '%s  %s\n' "$CAGEFORGE_VM_IMAGE_SHA256" "$image" | sha256sum --check --status
          echo "CAGEFORGE_VM_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Archive the checked-out source
        run: git archive --format=tar.gz --prefix=cageforge-source/ \
          --output="$RUNNER_TEMP/cageforge-source.tar.gz" HEAD

      - name: Run the Java consumer in the Cageforge QEMU guest
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          java_archive=$(find "$RUNNER_TEMP/cageforge-java-consumer" -name 'cageforge-java-consumer-smoke.tar.gz' -type f -print -quit)
          test -n "$java_archive"
          ./ci/run-native-linux-vm.sh \
            --image "$CAGEFORGE_VM_IMAGE" \
            --source-archive "$RUNNER_TEMP/cageforge-source.tar.gz" \
            --suite java \
            --payload "java-smoke=$java_archive"

  cli-build:
    name: "Cageforge CLI cross-build (${{ matrix.target }})"
    needs: [changes, common-components, native-linux, native-linux-arm64, linux-bwrap-resources, native-macos, native-windows]
    if: ${{ always() && (needs.changes.outputs.linux_sandbox == 'true' || needs.changes.outputs.macos_sandbox == 'true' || needs.changes.outputs.windows_sandbox == 'true') && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            feature: linux-bundled-bubblewrap
            zig: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04
            feature: linux-bundled-bubblewrap
            zig: true
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            feature: windows
            zig: false
          - target: aarch64-pc-windows-msvc
            runner: windows-2025
            feature: windows
            zig: false
          - target: x86_64-apple-darwin
            runner: macos-26-intel
            feature: macos
            zig: false
          - target: aarch64-apple-darwin
            runner: macos-26
            feature: macos
            zig: false
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Zig for ARM64 Linux cross-build
        if: matrix.zig
        uses: mlugg/setup-zig@v2
      - name: Install cargo-zigbuild for ARM64 Linux cross-build
        if: matrix.zig
        run: cargo install cargo-zigbuild --locked
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI for the selected target
        run: |
          set -euo pipefail
          build=(cargo build --locked --release -p cageforge-cli --target "${{ matrix.target }}" --no-default-features --features "${{ matrix.feature }}")
          if [[ "${{ matrix.zig }}" == true ]]; then
            build=(cargo zigbuild --locked --release -p cageforge-cli --target "${{ matrix.target }}" --no-default-features --features "${{ matrix.feature }}")
          fi
          "${build[@]}"

  native-linux:
    name: Linux sandbox (QEMU/KVM)
    needs: changes
    if: ${{ needs.changes.outputs.linux_sandbox == 'true' }}
    uses: m62624/cageforge/.github/workflows/native-linux-vm.yml@main
    with:
      pr_number: ${{ github.event.pull_request.number || '' }}
      expected_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      source_ref: ${{ inputs.ref || github.sha }}
      full: ${{ inputs.full || false }}

  native-linux-arm64:
    name: "Linux sandbox (cross-build target: ARM64)"
    needs: changes
    if: ${{ needs.changes.outputs.linux_sandbox == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Cross-check Linux ARM64 backend surfaces
        run: |
          set -euo pipefail
          cargo check -p cageforge-linux --target aarch64-unknown-linux-gnu --lib --all-targets --no-default-features
          cargo check -p cageforge-linux --target aarch64-unknown-linux-gnu --bin cageforge-linux-helper --no-default-features
          cargo check -p cageforge --target aarch64-unknown-linux-gnu --no-default-features --features linux
          cargo check -p cageforge-cli --target aarch64-unknown-linux-gnu --no-default-features --features linux
          cargo check -p cageforge-cli --target aarch64-unknown-linux-gnu --no-default-features --features linux-bundled-bubblewrap

  linux-bwrap-resources:
    name: "Linux Bubblewrap resource (${{ matrix.arch }})"
    needs: changes
    if: ${{ needs.changes.outputs.linux_sandbox == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            expected_machine: X86-64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            expected_machine: AArch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Restore verified Bubblewrap resource
        id: bwrap-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            crates/cageforge-bwrap/assets/linux-${{ matrix.arch }}/bwrap
            crates/cageforge-bwrap/assets/linux-${{ matrix.arch }}/bwrap.sha256
          key: >-
            cageforge-bwrap-${{ matrix.arch }}-${{ matrix.runner }}-
            ${{ hashFiles(
              'Cargo.toml',
              'Cargo.lock',
              'rust-toolchain',
              'rust-toolchain.toml',
              '.cargo/**',
              '.github/workflows/ci.yml',
              'crates/cageforge-bwrap/Cargo.toml',
              'crates/cageforge-bwrap/build.rs',
              'crates/cageforge-bwrap/src/**',
              'crates/cageforge-bwrap/vendor/bubblewrap/**'
            ) }}
      - uses: Swatinem/rust-cache@v2
      - name: Install native Bubblewrap build dependencies
        if: steps.bwrap-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential pkg-config libcap-dev binutils
      - name: Build the pinned Bubblewrap resource
        if: steps.bwrap-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "crates/cageforge-bwrap/assets/linux-${{ matrix.arch }}"
          cargo run --release -p cageforge-bwrap -- \
            --output "crates/cageforge-bwrap/assets/linux-${{ matrix.arch }}/bwrap"
      - name: Verify resource architecture and embedded mode
        run: |
          set -euo pipefail
          resource="crates/cageforge-bwrap/assets/linux-${{ matrix.arch }}/bwrap"
          readelf -h "$resource" | grep -F "${{ matrix.expected_machine }}"
          test -s "${resource}.sha256"
          cargo test -p cageforge-bwrap --no-default-features --features embedded
          cargo check -p cageforge-linux --no-default-features --features bundled-bubblewrap
          cargo check -p cageforge --no-default-features --features linux-bundled-bubblewrap
      - name: Cache verified Bubblewrap resource
        if: steps.bwrap-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            crates/cageforge-bwrap/assets/linux-${{ matrix.arch }}/bwrap
            crates/cageforge-bwrap/assets/linux-${{ matrix.arch }}/bwrap.sha256
          key: >-
            cageforge-bwrap-${{ matrix.arch }}-${{ matrix.runner }}-
            ${{ hashFiles(
              'Cargo.toml',
              'Cargo.lock',
              'rust-toolchain',
              'rust-toolchain.toml',
              '.cargo/**',
              '.github/workflows/ci.yml',
              'crates/cageforge-bwrap/Cargo.toml',
              'crates/cageforge-bwrap/build.rs',
              'crates/cageforge-bwrap/src/**',
              'crates/cageforge-bwrap/vendor/bubblewrap/**'
            ) }}
  native-macos:
    name: macOS sandbox
    needs: changes
    if: ${{ needs.changes.outputs.macos_sandbox == 'true' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Probe macOS lifecycle ownership prerequisites
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          probe_dir=$(mktemp -d "${RUNNER_TEMP}/cageforge-coalition.XXXXXX")
          probe_label="dev.cageforge.ci-coalition-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rustc --edition 2024 -D warnings ci/macos-lifecycle-probe.rs -o "$probe_dir/probe"
          "$probe_dir/probe"
          sudo "$probe_dir/probe"
          # A root shell is not equivalent to a launchd-owned service. Measure
          # both; this transient CI job is not a Cageforge setup installation.
          trap 'sudo launchctl remove "$probe_label" || true' EXIT
          sudo launchctl submit -l "$probe_label" -o "$probe_dir/service.out" -e "$probe_dir/service.err" -- "$probe_dir/probe"
          for attempt in {1..100}; do
            if sudo test -f "$probe_dir/service.out" && sudo grep -q '^probe complete$' "$probe_dir/service.out"; then
              sudo cat "$probe_dir/service.out" "$probe_dir/service.err"
              exit 0
            fi
            sleep 0.1
          done
          sudo cat "$probe_dir/service.out" "$probe_dir/service.err" || true
          sudo launchctl list "$probe_label" || true
          exit 1
      - name: Probe independent macOS descendant cleanup
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          probe_dir=$(mktemp -d "${RUNNER_TEMP}/cageforge-families.XXXXXX")
          first_label="dev.cageforge.ci-family-first-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          second_label="dev.cageforge.ci-family-second-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rustc --edition 2024 -D warnings ci/macos-lifecycle-probe.rs -o "$probe_dir/probe"
          mkdir "$probe_dir/first" "$probe_dir/second"
          trap 'launchctl remove "$first_label" || true; launchctl remove "$second_label" || true' EXIT
          launchctl submit -l "$first_label" -o "$probe_dir/first.out" -e "$probe_dir/first.err" -- "$probe_dir/probe" family "$probe_dir/first"
          launchctl submit -l "$second_label" -o "$probe_dir/second.out" -e "$probe_dir/second.err" -- "$probe_dir/probe" family "$probe_dir/second"
          if ! "$probe_dir/probe" families "$probe_dir/first" "$probe_dir/second"; then
            cat "$probe_dir/first.out" "$probe_dir/first.err" "$probe_dir/second.out" "$probe_dir/second.err" || true
            launchctl list "$first_label" || true
            launchctl list "$second_label" || true
            exit 1
          fi
      - name: Check macOS backend formatting
        run: cargo fmt --package cageforge-macos --package cageforge -- --check
      - name: Lint macOS backend
        run: cargo clippy -p cageforge-macos --all-targets -- -D warnings
      - name: Lint the unified facade with the macOS feature
        run: cargo clippy -p cageforge --no-default-features --features macos --all-targets -- -D warnings
      - name: Test macOS backend
        run: cargo test -p cageforge-macos --all-targets
      - name: Check macOS backend documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p cageforge-macos --no-deps
      - name: Test the unified facade with the macOS feature
        run: cargo test -p cageforge --no-default-features --features macos --all-targets
      - name: Check macOS facade documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p cageforge --no-default-features --features macos --no-deps
      - name: Lint and test the CLI with the macOS feature
        run: |
          set -euo pipefail
          cargo clippy -p cageforge-cli --no-default-features --features macos --all-targets -- -D warnings
          cargo test -p cageforge-cli --no-default-features --features macos --all-targets
          cargo doc -p cageforge-cli --no-default-features --features macos --no-deps

  native-windows:
    name: "Windows sandbox (Windows Server 2025)"
    needs: changes
    if: ${{ needs.changes.outputs.windows_sandbox == 'true' }}
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: aarch64-pc-windows-msvc
      - name: Install Windows ARM64 target
        run: rustup target add aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Lint Windows backend in every feature mode
        run: |
          set -euo pipefail
          cargo fmt --package cageforge-windows -- --check
          cargo clippy -p cageforge-windows --all-targets --no-default-features -- -D warnings
          cargo clippy -p cageforge-windows --all-targets --features bundled-helpers -- -D warnings
          cargo clippy -p cageforge-windows --all-targets --all-features -- -D warnings
          cargo fmt --package cageforge -- --check
          cargo clippy -p cageforge --no-default-features --features windows --all-targets -- -D warnings
      - name: Test Windows backend in every feature mode
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $reportDirectory = Join-Path $PWD 'test-reports'
          New-Item -ItemType Directory -Force -Path $reportDirectory | Out-Null
          $modes = @(
            [pscustomobject]@{
              Name = 'no-default-features'
              Arguments = @('--no-default-features')
            },
            [pscustomobject]@{
              Name = 'bundled-helpers'
              Arguments = @('--features', 'bundled-helpers')
            },
            [pscustomobject]@{
              Name = 'all-features'
              Arguments = @('--all-features')
            }
          )
          $reports = @()
          $failed = $false

          foreach ($mode in $modes) {
            $logPath = Join-Path $reportDirectory "$($mode.Name).log"
            $arguments = @('test', '-p', 'cageforge-windows') + $mode.Arguments
            & cargo @arguments *> $logPath
            $exitCode = $LASTEXITCODE
            $output = if (Test-Path -LiteralPath $logPath) {
              Get-Content -LiteralPath $logPath -Raw
            } else {
              ''
            }
            if ($output) {
              Write-Output $output
            }

            $tests = [regex]::Matches(
              $output,
              '(?m)^test (?<name>.+?) \.\.\. (?<status>ok|FAILED|ignored)\r?$'
            ) | ForEach-Object {
              [ordered]@{
                name = $_.Groups['name'].Value
                status = $_.Groups['status'].Value
              }
            }
            $summaries = [regex]::Matches(
              $output,
              '(?m)^test result: (?<summary>.+?)\r?$'
            ) | ForEach-Object {
              $_.Groups['summary'].Value
            }
            $reports += [ordered]@{
              feature_mode = $mode.Name
              exit_code = $exitCode
              log_file = Split-Path -Leaf $logPath
              tests = @($tests)
              summaries = @($summaries)
            }
            if ($exitCode -ne 0) {
              $failed = $true
            }
          }

          $reports | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 -LiteralPath (Join-Path $reportDirectory 'report.json')
          if ($failed) {
            exit 1
          }
      - name: Check Windows ARM64 target surfaces
        run: |
          set -euo pipefail
          cargo check -p cageforge-windows --target aarch64-pc-windows-msvc --lib --all-targets --no-default-features
          cargo check -p cageforge-windows --target aarch64-pc-windows-msvc --lib --all-targets --all-features
          cargo check -p cageforge --target aarch64-pc-windows-msvc --no-default-features --features windows
      - name: Check Windows backend documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p cageforge-windows --no-deps
      - name: Test and document the unified facade with the Windows feature
        run: |
          set -euo pipefail
          cargo test -p cageforge --no-default-features --features windows --all-targets
          cargo doc -p cageforge --no-default-features --features windows --no-deps
      - name: Lint and test the CLI with the Windows feature
        run: |
          set -euo pipefail
          cargo clippy -p cageforge-cli --no-default-features --features windows --all-targets -- -D warnings
          cargo test -p cageforge-cli --no-default-features --features windows --all-targets
          cargo doc -p cageforge-cli --no-default-features --features windows --no-deps
      - name: Upload Windows native test report
        if: ${{ failure() && hashFiles('test-reports/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cageforge-windows-test-report
          path: test-reports
          if-no-files-found: warn

  coverage-portable:
    name: "portable coverage (build target: Linux)"
    needs: [changes, common-components]
    # TODO: Re-enable this mandatory metric after the project agrees on the
    # coverage policy and the right report destination. The intended gate is
    # at least 90 percent for the portable packages listed below.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Pin the installer action so the coverage toolchain remains reproducible
      # and does not turn a routine CI run into a cargo install build.
      - uses: taiki-e/install-action@v2.85.13
        with:
          tool: cargo-tarpaulin
      - name: Generate portable coverage
        run: >-
          cargo tarpaulin
          --locked
          --ignore-config
          --timeout 300
          --fail-under 90
          --out Xml
          --output-dir coverage
          --exclude-files
          'crates/*/tests/*'
          'crates/cageforge-bwrap/**'
          'crates/cageforge-linux/**'
          'tools/*'
          --packages
          cageforge-backend-api
          cageforge
          cageforge-command
          cageforge-config
          cageforge-network-proxy
          cageforge-path
          cageforge-policy
          cageforge-policy-compose
          cageforge-upstream-review
          -- --test-threads=1
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: cageforge-portable-coverage
          path: coverage/*.xml
          if-no-files-found: error

      # TODO: add a separate Linux-native coverage measurement once the tool
      # can attribute code across the Bubblewrap/helper process boundary. Do
      # not merge that number into portable coverage or pretend compilation
      # on another OS replaces native enforcement coverage.

  ci-pass:
    name: CI passed
    if: ${{ always() }}
    needs:
      [changes, common-components, java-binding, java-linux-qemu, cli-build, native-linux, native-linux-arm64, linux-bwrap-resources, native-macos, native-windows, coverage-portable]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a selected job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "A selected CI job failed or was cancelled."
          exit 1
      - name: All selected checks passed
        run: echo "Cageforge CI routing and selected checks passed."
