name: CI

on:
  # Keep the required status for normal PR activity and rerun it when a
  # maintainer manually adds or removes a sandbox label.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      scope:
        description: Check scope
        required: true
        default: auto
        type: choice
        options: [auto, default, full]
      sandbox:
        description: Optional sandbox lane to run manually
        required: true
        default: none
        type: choice
        options: [none, linux, macos, windows, all]

permissions:
  contents: read
  pull-requests: read

concurrency:
  # A newer commit supersedes an older run for the same branch or PR.
  group: cageforge-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Current runners for portable checks:
#   ubuntu-latest
#   windows-latest
#   macos-latest
#
# Reserved runner labels for future native backends and release builds:
#   ubuntu-24.04       — Linux x64
#   ubuntu-24.04-arm   — Linux ARM64
#   macos-26-intel     — macOS Intel
#   macos-26           — macOS Apple Silicon
#   windows-2025       — Windows x64/release host
#   windows-11-arm     — Windows ARM64
#
# CI routing algorithm:
# 1. Main is the full quality gate: all common components, every Linux feature
#    combination, and every platform target lane always run.
# 2. PRs always run the common Linux components and Linux feature combinations.
# 3. A PR selects the Linux sandbox when cageforge-linux itself, Bubblewrap, a
#    direct/transitive workspace dependency, a Linux test dev-dependency, or a
#    workspace/CI input changes.
# 4. Manual PR labels sandbox-linux, sandbox-macos, and sandbox-windows force
#    the requested lane. Labels are never applied automatically by the labeler.
# 5. macOS/Windows target lanes run their host checks now and report the missing
#    native enforcement crate until those crates are introduced.

jobs:
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      linux_native: ${{ steps.classify.outputs.linux_native }}
      macos_native: ${{ steps.classify.outputs.macos_native }}
      windows_native: ${{ steps.classify.outputs.windows_native }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: classify
        name: Classify changed paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MANUAL_SCOPE: ${{ inputs.scope }}
          MANUAL_SANDBOX: ${{ inputs.sandbox }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          set -euo pipefail

          mode=default
          linux_native=false
          macos_native=false
          windows_native=false
          shared_change=false
          changed_paths=()
          manual_linux=false
          manual_macos=false
          manual_windows=false

          for label in ${PR_LABELS:-}; do
            case "$label" in
              sandbox-linux) manual_linux=true ;;
              sandbox-macos) manual_macos=true ;;
              sandbox-windows) manual_windows=true ;;
            esac
          done

          case "${MANUAL_SANDBOX:-none}" in
            none) ;;
            linux) manual_linux=true ;;
            macos) manual_macos=true ;;
            windows) manual_windows=true ;;
            all)
              manual_linux=true
              manual_macos=true
              manual_windows=true
              ;;
            *) echo "Unknown sandbox lane: ${MANUAL_SANDBOX}" >&2; exit 1 ;;
          esac

          if [[ "$EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            # Main always checks every platform target. The macOS/Windows jobs
            # remain useful before their native enforcement crates exist: they
            # run the common components on that host and fail closed if a
            # future crate is malformed.
            linux_native=true
            macos_native=true
            windows_native=true
            mode=main
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            case "${MANUAL_SCOPE:-auto}" in
              full) linux_native=true; mode=manual-full ;;
              default|auto) ;;
              *) echo "Unknown scope: ${MANUAL_SCOPE}" >&2; exit 1 ;;
            esac
          else
            if [[ "$BASE_SHA" =~ ^0+$ ]]; then
              mapfile -t changed_paths < <(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA")
            else
              mapfile -t changed_paths < <(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")
            fi
          fi

          for path in "${changed_paths[@]}"; do
            case "$path" in
              crates/cageforge-linux/*|crates/cageforge-bwrap/*)
                linux_native=true
                ;;
              crates/cageforge-backend-api/*|crates/cageforge-command/*|crates/cageforge-config/*|crates/cageforge-network-proxy/*|crates/cageforge-path/*|crates/cageforge-policy/*|crates/cageforge-policy-compose/*)
                linux_native=true
                ;;
              crates/cageforge-macos/*) ;;
              crates/cageforge-windows/*) ;;
              Cargo.toml|Cargo.lock|rust-toolchain|rust-toolchain.toml|.cargo/*|.github/workflows/*|ci/*)
                shared_change=true
                ;;
              *) ;;
            esac
          done

          if [[ "$shared_change" == true ]]; then
            linux_native=true
            mode=shared
          elif [[ "$mode" == default && ("$linux_native" == true || "$macos_native" == true || "$windows_native" == true) ]]; then
            mode=native
          fi

          [[ "$manual_linux" == true ]] && linux_native=true
          [[ "$manual_macos" == true ]] && macos_native=true
          [[ "$manual_windows" == true ]] && windows_native=true
          if [[ "$manual_linux" == true || "$manual_macos" == true || "$manual_windows" == true ]]; then
            mode=manual
          fi

          {
            echo "mode=${mode}"
            echo "linux_native=${linux_native}"
            echo "macos_native=${macos_native}"
            echo "windows_native=${windows_native}"
          } >> "$GITHUB_OUTPUT"

  common-components:
    name: "common components (build target: Linux)"
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: >-
          cargo fmt
          -p cageforge-backend-api
          -p cageforge-core
          -p cageforge-command
          -p cageforge-config
          -p cageforge-network-proxy
          -p cageforge-path
          -p cageforge-policy
          -p cageforge-policy-compose
          -p cageforge-upstream-review
          -- --check
      - name: Clippy for common components
        run: >-
          cargo clippy
          -p cageforge-backend-api
          -p cageforge-core
          -p cageforge-command
          -p cageforge-config
          -p cageforge-network-proxy
          -p cageforge-path
          -p cageforge-policy
          -p cageforge-policy-compose
          -p cageforge-upstream-review
          --all-targets -- -D warnings
      - name: Test common components
        run: >-
          cargo test
          -p cageforge-backend-api
          -p cageforge-core
          -p cageforge-command
          -p cageforge-config
          -p cageforge-network-proxy
          -p cageforge-path
          -p cageforge-policy
          -p cageforge-policy-compose
          -p cageforge-upstream-review
      - name: Lint network proxy without runtime feature
        run: >-
          cargo clippy
          -p cageforge-network-proxy
          --no-default-features
          --all-targets -- -D warnings
      - name: Test network proxy without runtime feature
        run: cargo test -p cageforge-network-proxy --no-default-features
      - name: Check common component documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: >-
          cargo doc
          -p cageforge-backend-api
          -p cageforge-core
          -p cageforge-command
          -p cageforge-config
          -p cageforge-network-proxy
          -p cageforge-path
          -p cageforge-policy
          -p cageforge-policy-compose
          -p cageforge-upstream-review
          --no-deps

  native-linux:
    name: Linux sandbox (QEMU/KVM)
    needs: changes
    if: needs.changes.outputs.linux_native == 'true'
    uses: m62624/cageforge/.github/workflows/native-linux-vm.yml@main
    with:
      pr_number: ${{ github.event.pull_request.number || '' }}
      expected_sha: ${{ github.event.pull_request.head.sha || github.sha }}

  native-macos:
    name: macOS target checks
    needs: changes
    if: needs.changes.outputs.macos_native == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check common component formatting on macOS
        run: cargo fmt --all -- --check
      - name: Clippy common components on macOS
        run: >-
          cargo clippy
          -p cageforge-backend-api
          -p cageforge-core
          -p cageforge-command
          -p cageforge-config
          -p cageforge-network-proxy
          -p cageforge-path
          -p cageforge-policy
          -p cageforge-policy-compose
          -p cageforge-upstream-review
          --all-targets -- -D warnings
      - name: Test common components on macOS
        run: >-
          cargo test
          -p cageforge-backend-api
          -p cageforge-core
          -p cageforge-command
          -p cageforge-config
          -p cageforge-network-proxy
          -p cageforge-path
          -p cageforge-policy
          -p cageforge-policy-compose
          -p cageforge-upstream-review
      - name: Run native macOS backend when available
        shell: bash
        run: |
          set -euo pipefail
          if cargo metadata --no-deps --format-version 1 | grep -q '"name":"cageforge-macos"'; then
            cargo fmt --package cageforge-macos -- --check
            cargo clippy -p cageforge-macos --all-targets -- -D warnings
            cargo test -p cageforge-macos
          else
            echo "::notice::cageforge-macos is not in this workspace yet; no native macOS enforcement crate was run."
          fi

  native-windows:
    name: Windows target checks
    needs: changes
    if: needs.changes.outputs.windows_native == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check common component formatting on Windows
        shell: bash
        run: cargo fmt --all -- --check
      - name: Clippy common components on Windows
        shell: bash
        run: >-
          cargo clippy
          -p cageforge-backend-api
          -p cageforge-core
          -p cageforge-command
          -p cageforge-config
          -p cageforge-network-proxy
          -p cageforge-path
          -p cageforge-policy
          -p cageforge-policy-compose
          -p cageforge-upstream-review
          --all-targets -- -D warnings
      - name: Test common components on Windows
        shell: bash
        run: >-
          cargo test
          -p cageforge-backend-api
          -p cageforge-core
          -p cageforge-command
          -p cageforge-config
          -p cageforge-network-proxy
          -p cageforge-path
          -p cageforge-policy
          -p cageforge-policy-compose
          -p cageforge-upstream-review
      - name: Run native Windows backend when available
        shell: bash
        run: |
          set -euo pipefail
          if cargo metadata --no-deps --format-version 1 | grep -q '"name":"cageforge-windows"'; then
            cargo fmt --package cageforge-windows -- --check
            cargo clippy -p cageforge-windows --all-targets -- -D warnings
            cargo test -p cageforge-windows
          else
            echo "::notice::cageforge-windows is not in this workspace yet; no native Windows enforcement crate was run."
          fi

  feature-surface:
    name: "feature combinations (build target: Linux)"
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Install bundled Bubblewrap build requirements
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcap-dev pkg-config
      # Keep these explicit. Workspace feature unification means that a
      # workspace-wide --no-default-features run can still enable the proxy's
      # runtime through cageforge-linux's target dependency.
      - name: Lint Linux library and helper binary in every feature mode
        run: |
          cargo clippy -p cageforge-bwrap --all-targets -- -D warnings
          cargo clippy -p cageforge-linux --lib --no-default-features --all-targets -- -D warnings
          cargo clippy -p cageforge-linux --lib --features bundled-bubblewrap --all-targets -- -D warnings
          cargo clippy -p cageforge-linux --lib --all-features --all-targets -- -D warnings
          cargo clippy -p cageforge-linux --bin cageforge-linux-helper --no-default-features -- -D warnings
          cargo clippy -p cageforge-linux --bin cageforge-linux-helper --features bundled-bubblewrap -- -D warnings
          cargo clippy -p cageforge-linux --bin cageforge-linux-helper --all-features -- -D warnings
      - name: Test Linux library and helper binary in every feature mode
        run: |
          cargo test -p cageforge-bwrap -p cageforge-linux --lib --no-default-features
          cargo test -p cageforge-linux --lib --features bundled-bubblewrap
          cargo test -p cageforge-linux --lib --all-features
      - name: Lint network proxy runtime and configuration-only modes
        run: |
          cargo clippy -p cageforge-network-proxy --no-default-features --all-targets -- -D warnings
          cargo clippy -p cageforge-network-proxy --features runtime --all-targets -- -D warnings
          cargo clippy -p cageforge-network-proxy --all-features --all-targets -- -D warnings
      - name: Test network proxy runtime and configuration-only modes
        run: |
          cargo test -p cageforge-network-proxy --all-features --all-targets
          cargo test -p cageforge-network-proxy --features runtime --all-targets
          cargo test -p cageforge-network-proxy --no-default-features --all-targets
      - name: Check Linux documentation in every public feature mode
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc -p cageforge-bwrap -p cageforge-linux --no-deps
          cargo doc -p cageforge-linux --features bundled-bubblewrap --no-deps
          cargo doc -p cageforge-linux --all-features --no-deps
      - name: Cross-check Windows library, helper, and proxy surfaces
        run: |
          cargo check -p cageforge-linux --target x86_64-pc-windows-msvc --lib --all-targets
          cargo check -p cageforge-linux --target x86_64-pc-windows-msvc --bin cageforge-linux-helper
          cargo check -p cageforge-network-proxy --target x86_64-pc-windows-msvc --all-features --all-targets
          cargo check -p cageforge-network-proxy --target x86_64-pc-windows-msvc --no-default-features --all-targets

  coverage-portable:
    name: "portable coverage (build target: Linux)"
    needs: [changes, common-components]
    # TODO: Re-enable this mandatory metric after the project agrees on the
    # coverage policy and the right report destination. The intended gate is
    # at least 90 percent for the portable packages listed below.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Pin the installer action so the coverage toolchain remains reproducible
      # and does not turn a routine CI run into a cargo install build.
      - uses: taiki-e/install-action@v2.85.13
        with:
          tool: cargo-tarpaulin
      - name: Generate portable coverage
        run: >-
          cargo tarpaulin
          --locked
          --ignore-config
          --timeout 300
          --fail-under 90
          --out Xml
          --output-dir coverage
          --exclude-files
          'crates/*/tests/*'
          'crates/cageforge-bwrap/**'
          'crates/cageforge-linux/**'
          'tools/*'
          --packages
          cageforge-backend-api
          cageforge-core
          cageforge-command
          cageforge-config
          cageforge-network-proxy
          cageforge-path
          cageforge-policy
          cageforge-policy-compose
          cageforge-upstream-review
          -- --test-threads=1
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: cageforge-portable-coverage
          path: coverage/*.xml
          if-no-files-found: error

      # TODO: add a separate Linux-native coverage measurement once the tool
      # can attribute code across the Bubblewrap/helper process boundary. Do
      # not merge that number into portable coverage or pretend compilation
      # on another OS replaces native enforcement coverage.

  ci-pass:
    name: CI passed
    if: always()
    needs:
      [changes, common-components, native-linux, native-macos, native-windows, feature-surface, coverage-portable]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a selected job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "A selected CI job failed or was cancelled."
          exit 1
      - name: All selected checks passed
        run: echo "Cageforge CI routing and selected checks passed."
