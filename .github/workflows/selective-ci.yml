name: Selective CI

on:
  # The labeler adds a quality label for a native-only diff. Manual labels or
  # workflow_dispatch remain available for explicitly rerunning one suite.
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:
    inputs:
      os:
        description: OS to test
        required: true
        default: all
        type: choice
        options: [all, linux, macos, windows]
      suite:
        description: Test suite to run
        required: true
        default: quality
        type: choice
        options: [test, quality]

permissions:
  contents: read

concurrency:
  group: cageforge-selective-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Native-only checks intentionally select exactly cageforge-core and the
# changed native crate. The package names and runner labels are placeholders
# until those native crates are added to the workspace.
#
# TODO: when a native crate is introduced, keep this mapping synchronized with
# .github/workflows/ci.yml and labeler.yml. A native-only pull request must not
# run unrelated native crates; a shared change is routed by the base CI matrix.

jobs:
  linux-test:
    name: Linux core + native test
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      (inputs.os == 'all' || inputs.os == 'linux') && inputs.suite == 'test') ||
      (github.event_name != 'workflow_dispatch' &&
      contains(github.event.pull_request.labels.*.name, 'ci-linux-test'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # TODO: replace cageforge-linux with the concrete changed native crate
      # when this workflow is split into per-native-crate jobs.
      - run: cargo test -p cageforge-core -p cageforge-linux

  linux-quality:
    name: Linux core + native fmt + clippy + test
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      (inputs.os == 'all' || inputs.os == 'linux') && inputs.suite == 'quality') ||
      (github.event_name != 'workflow_dispatch' &&
      contains(github.event.pull_request.labels.*.name, 'ci-linux-quality'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --package cageforge-core --package cageforge-linux -- --check
      - run: cargo clippy -p cageforge-core -p cageforge-linux --all-targets -- -D warnings
      - run: cargo test -p cageforge-core -p cageforge-linux

  macos-test:
    name: macOS core + native test
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      (inputs.os == 'all' || inputs.os == 'macos') && inputs.suite == 'test') ||
      (github.event_name != 'workflow_dispatch' &&
      contains(github.event.pull_request.labels.*.name, 'ci-macos-test'))
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p cageforge-core -p cageforge-macos

  macos-quality:
    name: macOS core + native fmt + clippy + test
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      (inputs.os == 'all' || inputs.os == 'macos') && inputs.suite == 'quality') ||
      (github.event_name != 'workflow_dispatch' &&
      contains(github.event.pull_request.labels.*.name, 'ci-macos-quality'))
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --package cageforge-core --package cageforge-macos -- --check
      - run: cargo clippy -p cageforge-core -p cageforge-macos --all-targets -- -D warnings
      - run: cargo test -p cageforge-core -p cageforge-macos

  windows-test:
    name: Windows core + native test
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      (inputs.os == 'all' || inputs.os == 'windows') && inputs.suite == 'test') ||
      (github.event_name != 'workflow_dispatch' &&
      contains(github.event.pull_request.labels.*.name, 'ci-windows-test'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p cageforge-core -p cageforge-windows

  windows-quality:
    name: Windows core + native fmt + clippy + test
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      (inputs.os == 'all' || inputs.os == 'windows') && inputs.suite == 'quality') ||
      (github.event_name != 'workflow_dispatch' &&
      contains(github.event.pull_request.labels.*.name, 'ci-windows-quality'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --package cageforge-core --package cageforge-windows -- --check
      - run: cargo clippy -p cageforge-core -p cageforge-windows --all-targets -- -D warnings
      - run: cargo test -p cageforge-core -p cageforge-windows

  selective-ci-pass:
    name: Selective CI passed
    if: always()
    needs:
      [linux-test, linux-quality, macos-test, macos-quality, windows-test, windows-quality]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a selected suite failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "Selected native/core checks passed or were not requested."
