name: Release

# Push an explicit pin/vX.Y.Z tag to start the release. The workflow prepares
# and tests an RC branch, creates the final tag only after the gates pass,
# builds the CLI artifacts, publishes the draft release, publishes workspace
# crates, and opens the version-sync PR.
on:
  push:
    tags:
      - "pin/v*"

permissions:
  contents: write

concurrency:
  group: cageforge-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.info.outputs.version }}
      tag: ${{ steps.info.outputs.tag }}
      rc_branch: ${{ steps.info.outputs.rc_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Extract release information
        id: info
        shell: bash
        run: |
          set -euo pipefail
          raw="${GITHUB_REF_NAME#pin/}"
          version="${raw#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::invalid release version: $version"
            exit 64
          }
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "rc_branch=rc/v$version"
          } >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Prepare and push the release candidate branch
        shell: bash
        env:
          VERSION: ${{ steps.info.outputs.version }}
          RC_BRANCH: ${{ steps.info.outputs.rc_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$RC_BRANCH"
          cargo install cargo-edit --locked
          cargo set-version --workspace "$VERSION"
          git add -A
          git commit -m "build: prepare Cageforge v$VERSION" || true
          git push --force origin "$RC_BRANCH"
          git push origin ":refs/tags/${GITHUB_REF_NAME}"

  tests:
    name: CI on release candidate
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.rc_branch }}

  tag:
    name: Create release tag
    needs: [prepare, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.rc_branch }}
          fetch-depth: 0
      - name: Tag the tested RC commit
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "$TAG" -m "Release $TAG"
          git push --force origin "$TAG"

  dist:
    name: Build CLI artifact (${{ matrix.target }})
    needs: [prepare, tag]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native sandbox validation has a separate matrix in ci.yml.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            zig: false
            feature: linux-bundled-bubblewrap
            helper: linux
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04
            zig: true
            feature: linux-bundled-bubblewrap
            helper: linux
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            zig: false
            feature: windows
            helper: windows
          - target: aarch64-pc-windows-msvc
            runner: windows-2025
            zig: false
            feature: windows
            helper: windows
          - target: x86_64-apple-darwin
            runner: macos-26-intel
            zig: false
            feature: macos
            helper: none
          - target: aarch64-apple-darwin
            runner: macos-26
            zig: false
            feature: macos
            helper: none
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Zig for ARM64 Linux cross-build
        if: matrix.zig
        uses: mlugg/setup-zig@v2
      - name: Install cargo-zigbuild for ARM64 Linux cross-build
        if: matrix.zig
        run: cargo install cargo-zigbuild --locked
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI and native companion binaries
        env:
          TARGET: ${{ matrix.target }}
          FEATURE: ${{ matrix.feature }}
          HELPER: ${{ matrix.helper }}
        run: |
          set -euo pipefail
          build=(cargo build --locked --release -p cageforge-cli --target "$TARGET" \
            --no-default-features --features "$FEATURE")
          if [[ "${{ matrix.zig }}" == true ]]; then
            build=(cargo zigbuild --locked --release -p cageforge-cli --target "$TARGET" \
              --no-default-features --features "$FEATURE")
          fi
          "${build[@]}"
          package="package/cageforge-cli-$TARGET"
          mkdir -p "$package"
          cli_binary="cageforge-cli"
          [[ "$TARGET" == *-pc-windows-msvc ]] && cli_binary+=".exe"
          cp "target/$TARGET/release/$cli_binary" "$package/"
          if [[ "$HELPER" == linux ]]; then
            helper_build=(cargo build --locked --release -p cageforge-linux --target "$TARGET" \
              --no-default-features --bin cageforge-linux-helper)
            if [[ "${{ matrix.zig }}" == true ]]; then
              helper_build=(cargo zigbuild --locked --release -p cageforge-linux --target "$TARGET" \
                --no-default-features --bin cageforge-linux-helper)
            fi
            "${helper_build[@]}"
            cp "target/$TARGET/release/cageforge-linux-helper" "$package/"
          elif [[ "$HELPER" == windows ]]; then
            cargo build --locked --release -p cageforge-windows --target "$TARGET" \
              --features bundled-helpers --bin cageforge-windows-setup
            cargo build --locked --release -p cageforge-windows --target "$TARGET" \
              --features bundled-helpers --bin cageforge-windows-command-runner
            cp "target/$TARGET/release/cageforge-windows-setup.exe" "$package/"
            cp "target/$TARGET/release/cageforge-windows-command-runner.exe" "$package/"
          fi
          tar -czf "cageforge-cli-$TARGET.tar.gz" -C package "cageforge-cli-$TARGET"
      - uses: actions/upload-artifact@v7
        with:
          name: cageforge-cli-${{ matrix.target }}
          path: cageforge-cli-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release-notes:
    name: Create draft GitHub release
    needs: [prepare, dist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cageforge-cli-*
          path: release-assets
          merge-multiple: true
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
      - name: Generate notes and create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          previous="$(git tag --list 'v*' --sort=-v:refname | grep -vx "$TAG" | head -n1 || true)"
          args=(-f tag_name="$TAG")
          [[ -n "$previous" ]] && args+=(-f previous_tag_name="$previous")
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            "${args[@]}" --jq .body > release-notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Cageforge $TAG" --notes-file release-notes.md --draft
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --title "Cageforge $TAG" --notes-file release-notes.md
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
            release-assets/*.tar.gz --clobber

  publish-release:
    name: Publish completed GitHub release
    needs: [prepare, dist, release-notes]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  publish-crates:
    name: Publish workspace crates
    needs: [prepare, dist]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Authenticate with crates.io trusted publishing
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish all publishable workspace crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --workspace --locked

  sync:
    name: Open version-sync PR
    needs: [prepare, dist, publish-crates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.rc_branch }}
          fetch-depth: 0
      - name: Open the RC-to-main sync PR
        env:
          RC_BRANCH: ${{ needs.prepare.outputs.rc_branch }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          base="${{ github.event.repository.default_branch }}"
          existing="$(gh pr list --head "$RC_BRANCH" --base "$base" --state open --json number --jq 'length')"
          if [[ "$existing" == 0 ]]; then
            gh pr create --head "$RC_BRANCH" --base "$base" \
              --title "release: sync Cageforge v$VERSION to $base" \
              --body "Created by the release workflow after the v$VERSION artifacts and crates were published."
          fi
