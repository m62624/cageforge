name: Release

# Push an explicit pin/vX.Y.Z tag to start the release. The workflow prepares
# and tests an RC branch, creates the final tag only after the gates pass,
# builds the CLI artifacts, publishes the draft release, publishes workspace
# crates, and opens the version-sync PR.
on:
  push:
    tags:
      - "pin/v*"

permissions:
  contents: write
  # The reusable CI workflow reads PR labels when it classifies changes. A
  # called workflow cannot elevate permissions granted by this caller.
  pull-requests: read

concurrency:
  group: cageforge-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.info.outputs.version }}
      tag: ${{ steps.info.outputs.tag }}
      rc_branch: ${{ steps.info.outputs.rc_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Extract release information
        id: info
        shell: bash
        run: |
          set -euo pipefail
          raw="${GITHUB_REF_NAME#pin/}"
          version="${raw#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::invalid release version: $version"
            exit 64
          }
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "rc_branch=rc/v$version"
          } >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Prepare and push the release candidate branch
        shell: bash
        env:
          VERSION: ${{ steps.info.outputs.version }}
          RC_BRANCH: ${{ steps.info.outputs.rc_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$RC_BRANCH"
          cargo install cargo-edit --locked
          cargo set-version --workspace "$VERSION"
          git add -A
          git commit -m "build: prepare Cageforge v$VERSION" || true
          git push --force origin "$RC_BRANCH"
          # The trigger tag may already have been removed manually or by a
          # retry. Its absence must not turn an otherwise prepared release
          # into a failed setup step.
          git push origin ":refs/tags/${GITHUB_REF_NAME}" || true

  tests:
    name: CI on release candidate
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.rc_branch }}
      # A release must validate every native backend and every CLI target.
      # Release-branch version changes must never select a partial PR scope.
      full: true

  tag:
    name: Create release tag
    needs: [prepare, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.rc_branch }}
          fetch-depth: 0
      - name: Tag the tested RC commit
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "$TAG" -m "Release $TAG"
          git push --force origin "$TAG"

  dist:
    name: Build and publish CLI artifacts
    needs: [prepare, tag]
    permissions:
      contents: write
    uses: ./.github/workflows/bin-release.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
    secrets: inherit

  jvm:
    name: Build JVM artifact
    needs: [prepare, tests, tag]
    uses: ./.github/workflows/jvm-release.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}

  publish-jvm:
    name: Publish JVM package to Maven Central
    # TODO(release-hardening): after the first successful Cageforge PyPI
    # release confirms the pending publisher, consider removing this gate and
    # returning registry publications to parallel execution.
    needs: [prepare, jvm, python, publish-python]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Download the tested JVM publication build
        uses: actions/download-artifact@v4
        with:
          name: cageforge-java-maven-build-${{ needs.prepare.outputs.version }}
          path: crates/bindings/cageforge-java/jvm/build/maven-publish
      - name: Restore the tested Gradle outputs
        working-directory: crates/bindings/cageforge-java/jvm
        run: |
          set -euo pipefail
          cp -a build/maven-publish/libs build/maven-publish/publications build/maven-publish/native build/
      - name: Publish signed artifacts to the Central Portal staging API
        working-directory: crates/bindings/cageforge-java/jvm
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          MAVEN_CENTRAL_NAMESPACE: ${{ vars.MAVEN_CENTRAL_NAMESPACE }}
        run: |
          set -euo pipefail
          test -n "$MAVEN_USERNAME" || { echo "MAVEN_CENTRAL_USERNAME is not configured" >&2; exit 64; }
          test -n "$MAVEN_PASSWORD" || { echo "MAVEN_CENTRAL_PASSWORD is not configured" >&2; exit 64; }
          test -n "$MAVEN_GPG_PRIVATE_KEY" || { echo "MAVEN_GPG_PRIVATE_KEY is not configured" >&2; exit 64; }
          test -n "$MAVEN_GPG_PASSPHRASE" || { echo "MAVEN_GPG_PASSPHRASE is not configured" >&2; exit 64; }
          test -n "$MAVEN_CENTRAL_NAMESPACE" || { echo "MAVEN_CENTRAL_NAMESPACE repository variable is not configured" >&2; exit 64; }
          gradle --no-daemon verifyMavenPublication verifyMavenSigning \
            -PnativeResourcesDir=build/native \
            -PmavenGroup="$MAVEN_CENTRAL_NAMESPACE" \
            -PreleaseVersion="${{ needs.prepare.outputs.version }}"
          gradle --no-daemon publishMavenJavaPublicationToCentralPortalRepository \
            -PnativeResourcesDir=build/native \
            -PmavenGroup="$MAVEN_CENTRAL_NAMESPACE" \
            -PreleaseVersion="${{ needs.prepare.outputs.version }}" \
            -PmavenRepositoryUrl="https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/" \
            -PallowMavenPublish=true
          auth="$(printf '%s:%s' "$MAVEN_USERNAME" "$MAVEN_PASSWORD" | base64 -w0)"
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer $auth" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/$MAVEN_CENTRAL_NAMESPACE?publishing_type=automatic"

  python:
    name: Build Python artifacts
    needs: [prepare, tests, tag]
    uses: ./.github/workflows/python-release.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}

  publish-python:
    name: Publish Python package to PyPI (trusted publishing)
    # PyPI's pending trusted publisher may be configured before cageforge
    # exists. The first publish then creates the project and subsequent
    # releases use the same keyless OIDC path.
    needs: [prepare, tag, python]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cageforge-python-*
          path: dist
          merge-multiple: true
      - name: Publish tested wheels and source distribution
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  release-notes:
    name: Create draft GitHub release
    needs: [prepare, dist, jvm, publish-jvm, python, publish-python, publish-crates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
      - name: Generate notes and create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          previous="$(git tag --list 'v*' --sort=-v:refname | grep -vx "$TAG" | head -n1 || true)"
          args=(-f tag_name="$TAG")
          [[ -n "$previous" ]] && args+=(-f previous_tag_name="$previous")
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            "${args[@]}" --jq .body > release-notes.md
          # cargo-dist has already created the draft release and uploaded the
          # binaries, checksums, and installers. Only replace its body with
          # the generated changelog followed by the cargo-dist install notes.
          dist_body="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          if printf '%s' "$dist_body" | grep -q '<!-- cageforge-changelog -->'; then
            echo "changelog already prepended; nothing to do"
            exit 0
          fi
          {
            echo '<!-- cageforge-changelog -->'
            cat release-notes.md
            echo
            echo '---'
            echo
            printf '%s\n' "$dist_body"
          } > combined-release-notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "Cageforge $TAG" --notes-file combined-release-notes.md --draft

  publish-release:
    name: Publish completed GitHub release
    needs: [prepare, dist, jvm, publish-jvm, python, publish-python, release-notes, publish-crates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  publish-crates:
    name: Publish workspace crates
    # Python publication is an upstream registry gate for the remaining
    # immutable package indexes. This keeps a failed first PyPI publisher
    # configuration from publishing the Rust workspace alone.
    # TODO(release-hardening): after the first successful Cageforge PyPI
    # release confirms the pending publisher, consider removing this gate and
    # returning registry publications to parallel execution.
    needs: [prepare, dist, jvm, publish-jvm, python, publish-python]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Bubblewrap crate verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential pkg-config libcap-dev
      - name: Authenticate with crates.io trusted publishing
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish with trusted publishing token
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --workspace --locked

  sync:
    name: Open version-sync PR
    needs: [prepare, dist, jvm, publish-jvm, python, publish-python, publish-crates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.rc_branch }}
          fetch-depth: 0
      - name: Open the RC-to-main sync PR
        env:
          RC_BRANCH: ${{ needs.prepare.outputs.rc_branch }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          base="${{ github.event.repository.default_branch }}"
          existing="$(gh pr list --head "$RC_BRANCH" --base "$base" --state open --json number --jq 'length')"
          if [[ "$existing" == 0 ]]; then
            gh pr create --head "$RC_BRANCH" --base "$base" \
              --title "release: sync Cageforge v$VERSION to $base" \
              --body "Created by the release workflow after the v$VERSION artifacts and crates were published."
          fi
