name: Release

# Push an explicit pin/vX.Y.Z tag to start the release. The workflow prepares
# and tests an RC branch, creates the final tag only after the gates pass,
# builds the CLI artifacts, publishes the draft release, publishes workspace
# crates, and opens the version-sync PR.
on:
  push:
    tags:
      - "pin/v*"

permissions:
  contents: write

concurrency:
  group: cageforge-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.info.outputs.version }}
      tag: ${{ steps.info.outputs.tag }}
      rc_branch: ${{ steps.info.outputs.rc_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Extract release information
        id: info
        shell: bash
        run: |
          set -euo pipefail
          raw="${GITHUB_REF_NAME#pin/}"
          version="${raw#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::invalid release version: $version"
            exit 64
          }
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "rc_branch=rc/v$version"
          } >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Prepare and push the release candidate branch
        shell: bash
        env:
          VERSION: ${{ steps.info.outputs.version }}
          RC_BRANCH: ${{ steps.info.outputs.rc_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$RC_BRANCH"
          cargo install cargo-edit --locked
          cargo set-version --workspace "$VERSION"
          git add -A
          git commit -m "build: prepare Cageforge v$VERSION" || true
          git push --force origin "$RC_BRANCH"
          git push origin ":refs/tags/${GITHUB_REF_NAME}"

  tests:
    name: CI on release candidate
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.rc_branch }}

  tag:
    name: Create release tag
    needs: [prepare, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.rc_branch }}
          fetch-depth: 0
      - name: Tag the tested RC commit
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "$TAG" -m "Release $TAG"
          git push --force origin "$TAG"

  dist:
    name: Build and publish CLI artifacts
    needs: [prepare, tag]
    permissions:
      contents: write
    uses: ./.github/workflows/bin-release.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
    secrets: inherit

  release-notes:
    name: Create draft GitHub release
    needs: [prepare, dist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
      - name: Generate notes and create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          previous="$(git tag --list 'v*' --sort=-v:refname | grep -vx "$TAG" | head -n1 || true)"
          args=(-f tag_name="$TAG")
          [[ -n "$previous" ]] && args+=(-f previous_tag_name="$previous")
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            "${args[@]}" --jq .body > release-notes.md
          # cargo-dist has already created the draft release and uploaded the
          # binaries, checksums, and installers. Only replace its body with
          # the generated changelog followed by the cargo-dist install notes.
          dist_body="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          if printf '%s' "$dist_body" | grep -q '<!-- cageforge-changelog -->'; then
            echo "changelog already prepended; nothing to do"
            exit 0
          fi
          {
            echo '<!-- cageforge-changelog -->'
            cat release-notes.md
            echo
            echo '---'
            echo
            printf '%s\n' "$dist_body"
          } > combined-release-notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "Cageforge $TAG" --notes-file combined-release-notes.md --draft

  publish-release:
    name: Publish completed GitHub release
    needs: [prepare, dist, release-notes]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  publish-crates:
    name: Publish workspace crates
    needs: [prepare, dist]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Select crates.io publication mode
        id: publication-mode
        shell: bash
        env:
          BOOTSTRAP_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "$BOOTSTRAP_TOKEN" ]]; then
            echo "mode=bootstrap" >> "$GITHUB_OUTPUT"
            echo "Using the one-time crates.io bootstrap token."
          else
            echo "mode=trusted" >> "$GITHUB_OUTPUT"
            echo "Using crates.io Trusted Publishing."
          fi
      - name: Authenticate with crates.io trusted publishing
        id: auth
        if: steps.publication-mode.outputs.mode == 'trusted'
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish with one-time bootstrap token
        if: steps.publication-mode.outputs.mode == 'bootstrap'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --locked
      - name: Publish with trusted publishing token
        if: steps.publication-mode.outputs.mode == 'trusted'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --workspace --locked

  sync:
    name: Open version-sync PR
    needs: [prepare, dist, publish-crates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.rc_branch }}
          fetch-depth: 0
      - name: Open the RC-to-main sync PR
        env:
          RC_BRANCH: ${{ needs.prepare.outputs.rc_branch }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          base="${{ github.event.repository.default_branch }}"
          existing="$(gh pr list --head "$RC_BRANCH" --base "$base" --state open --json number --jq 'length')"
          if [[ "$existing" == 0 ]]; then
            gh pr create --head "$RC_BRANCH" --base "$base" \
              --title "release: sync Cageforge v$VERSION to $base" \
              --body "Created by the release workflow after the v$VERSION artifacts and crates were published."
          fi
