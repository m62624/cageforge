name: Labeler

on:
  # This workflow only runs a fixed github-script and never checks out or
  # executes pull-request code, so pull_request_target can write labels for
  # forked pull requests safely.
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  labeler:
    runs-on: ubuntu-latest
    steps:
      - name: Create and apply labels
        uses: actions/github-script@v9
        with:
          script: |
            const title = context.payload.pull_request.title;
            const pullRequest = context.payload.pull_request.number;
            const repository = {
              owner: context.repo.owner,
              repo: context.repo.repo,
            };

            const conventional = [
              ['feat', 'feat', '0576b9'],
              ['fix', 'fix', 'd73a4a'],
              ['refactor', 'refactor', 'f2c744'],
              ['docs', 'docs', '0075ca'],
              ['chore', 'chore', 'bbbbbb'],
              ['build', 'build', 'ededed'],
              ['ci', 'ci', '5319e7'],
              ['test', 'test', 'c5def5'],
              ['style', 'style', '2c61f6'],
            ];

            const ciLabels = [
              ['ci-linux-test', '1d76db'],
              ['ci-linux-quality', '5319e7'],
              ['ci-macos-test', '1d76db'],
              ['ci-macos-quality', '5319e7'],
              ['ci-windows-test', '1d76db'],
              ['ci-windows-quality', '5319e7'],
            ];

            const labelsToCreate = [
              ...conventional.map(([, name, color]) => ({ name, color })),
              ...ciLabels.map(([name, color]) => ({ name, color })),
            ];

            for (const { name, color } of labelsToCreate) {
              try {
                await github.rest.issues.getLabel({ ...repository, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ ...repository, name, color });
              }
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...repository,
              pull_number: pullRequest,
              per_page: 100,
            });
            const changedPaths = files.map(({ filename }) => filename);

            const nativeCrates = [
              ['crates/cageforge-linux/', 'ci-linux-quality'],
              ['crates/cageforge-macos/', 'ci-macos-quality'],
              ['crates/cageforge-windows/', 'ci-windows-quality'],
            ];

            const nativeLabelFor = (path) => {
              const nativeCrate = nativeCrates.find(([prefix]) => path.startsWith(prefix));
              return nativeCrate?.[1];
            };

            const isSharedChange = (path) => {
              if (path.startsWith('crates/')) return nativeLabelFor(path) === undefined;
              // Files outside crates/ can change build, policy, CI, docs, or
              // release behavior, so they require the complete OS matrix.
              return true;
            };

            // Remove stale routing labels before applying the current path
            // classification. This prevents a previous native-only commit
            // from selecting the wrong crate after the PR changes again.
            const existingLabels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              ...repository,
              issue_number: pullRequest,
              per_page: 100,
            });
            for (const label of existingLabels) {
              if (!ciLabels.some(([name]) => name === label.name)) continue;
              await github.rest.issues.removeLabel({
                ...repository,
                issue_number: pullRequest,
                name: label.name,
              });
            }

            const labelsToApply = [];
            for (const [prefix, name] of conventional) {
              if (title.startsWith(`${prefix}:`) || title.startsWith(`${prefix}(`)) {
                labelsToApply.push(name);
              }
            }

            const selectivePrefixes = [
              ['test(linux):', 'ci-linux-test'],
              ['quality(linux):', 'ci-linux-quality'],
              ['test(macos):', 'ci-macos-test'],
              ['quality(macos):', 'ci-macos-quality'],
              ['test(windows):', 'ci-windows-test'],
              ['quality(windows):', 'ci-windows-quality'],
            ];
            for (const [prefix, name] of selectivePrefixes) {
              if (title.startsWith(prefix)) labelsToApply.push(name);
            }

            const hasSharedChange = changedPaths.some(isSharedChange);
            if (!hasSharedChange) {
              for (const path of changedPaths) {
                const label = nativeLabelFor(path);
                if (label) labelsToApply.push(label);
              }
            }

            if (/^[a-z]+(!):/.test(title) || /^[a-z]+\(.*\)(!):/.test(title)) {
              const name = 'breaking';
              try {
                await github.rest.issues.getLabel({ ...repository, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  ...repository,
                  name,
                  color: 'd93f0b',
                });
              }
              labelsToApply.push(name);
            }

            if (labelsToApply.length > 0) {
              await github.rest.issues.addLabels({
                ...repository,
                issue_number: pullRequest,
                labels: [...new Set(labelsToApply)],
              });
            }
