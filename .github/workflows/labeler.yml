name: Labeler

on:
  # This workflow only runs a fixed github-script and never checks out or
  # executes pull-request code, so pull_request_target can write labels for
  # forked pull requests safely.
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  labeler:
    runs-on: ubuntu-latest
    steps:
      - name: Create and apply labels
        uses: actions/github-script@v9
        with:
          script: |
            const title = context.payload.pull_request.title;
            const pullRequest = context.payload.pull_request.number;
            const repository = {
              owner: context.repo.owner,
              repo: context.repo.repo,
            };

            const conventional = [
              ['feat', 'feat', '0576b9'],
              ['fix', 'fix', 'd73a4a'],
              ['refactor', 'refactor', 'f2c744'],
              ['docs', 'docs', '0075ca'],
              ['chore', 'chore', 'bbbbbb'],
              ['build', 'build', 'ededed'],
              ['ci', 'ci', '5319e7'],
              ['test', 'test', 'c5def5'],
              ['style', 'style', '2c61f6'],
            ];

            const labelsToCreate = conventional.map(([, name, color]) => ({ name, color }));

            for (const { name, color } of labelsToCreate) {
              try {
                await github.rest.issues.getLabel({ ...repository, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ ...repository, name, color });
              }
            }

            const labelsToApply = [];
            for (const [prefix, name] of conventional) {
              if (title.startsWith(`${prefix}:`) || title.startsWith(`${prefix}(`)) {
                labelsToApply.push(name);
              }
            }

            if (/^[a-z]+(!):/.test(title) || /^[a-z]+\(.*\)(!):/.test(title)) {
              const name = 'breaking';
              try {
                await github.rest.issues.getLabel({ ...repository, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  ...repository,
                  name,
                  color: 'd93f0b',
                });
              }
              labelsToApply.push(name);
            }

            if (labelsToApply.length > 0) {
              await github.rest.issues.addLabels({
                ...repository,
                issue_number: pullRequest,
                labels: [...new Set(labelsToApply)],
              });
            }
